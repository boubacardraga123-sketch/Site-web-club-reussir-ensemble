<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;900&family=Work+Sans:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161616; --ink2:#4d4d4d;
  --paper:#FFFFFF; --paper2:#F4F4F4;
  --card:#fff;
  --red:#E4132B; --gold:#B8101F;
  --line: rgba(20,20,20,.15);
  --line-soft: rgba(20,20,20,.07);
  --font-title: 'Work Sans', sans-serif;
  --font-body: 'Work Sans', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --radius: 4px;
}
[data-theme="dark"]{
  --ink:#F5F5F5; --ink2:#B5B5B5;
  --paper:#161616; --paper2:#0D0D0D;
  --card:#1E1E1E;
  --line: rgba(245,245,245,.14);
  --line-soft: rgba(245,245,245,.07);
}
[data-theme="dark"] .topbar,
[data-theme="dark"] .admin-top,
[data-theme="dark"] .site-footer,
[data-theme="dark"] .toast,
[data-theme="dark"] .btn-ink,
[data-theme="dark"] .admin-tabs button.active{
  background:#0D0D0D; color:#F5F5F5; border-color:#0D0D0D;
}
[data-theme="dark"] .site-footer strong{ color:#fff; }
[data-theme="dark"] .lightbox .cap,
[data-theme="dark"] .lightbox .close{ color:#fff; border-color:#fff; }
[data-theme="dark"] .fiche{ border-color: var(--ink); }
[data-theme="dark"] img{ opacity:.92; }
.theme-toggle{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:inherit;border-radius:999px;width:36px;height:36px;flex-shrink:0;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;margin-left:auto}
.theme-toggle:hover{border-color:rgba(255,255,255,.6)}
*{box-sizing:border-box;margin:0;padding:0}

/* ── BANDEAU DÉFILANT — citations de motivation ── */
.marquee{
  background:linear-gradient(90deg, var(--red), #FF8A5C);
  overflow:hidden; white-space:nowrap;
  padding:9px 0;
}
.marquee-track{
  display:inline-block;
  animation: marquee-scroll 38s linear infinite;
  will-change: transform;
}
.marquee-track span{
  display:inline-block;
  font-family:var(--font-mono); font-size:13.5px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:#fff;
  padding:0 28px;
}
.marquee-track span::after{ content:'✦'; margin-left:28px; opacity:.7; }
@keyframes marquee-scroll{
  from{ transform:translateX(0); }
  to{ transform:translateX(-50%); }
}
@media (prefers-reduced-motion: reduce){
  .marquee-track{ animation:none; }
  .marquee{ overflow-x:auto; }
}
body{
  background:var(--paper2);
  font-family:var(--font-body);color:var(--ink);min-height:100vh;
  font-size:16px;
}
h1,h2,h3{font-family:var(--font-title);color:var(--ink);line-height:1.1;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
a{color:inherit}

/* ── TOPBAR ── */
.topbar{background:var(--ink);color:var(--paper);padding:14px 0}
.topbar .row{display:flex;align-items:center;gap:12px}
.brand-seal{width:auto;height:60px;min-width:60px;border-radius:6px;border:none;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--gold);flex-shrink:0;overflow:hidden;padding:4px 8px}
.brand-seal img{width:auto;height:100%;max-width:160px;object-fit:contain;border-radius:2px}
.brand-txt{flex:1;min-width:0}
.brand-txt .n{font-family:var(--font-title);font-weight:700;font-size:18px}
.brand-txt .m{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#a8a8a8;margin-top:1px}
.admin-link{font-family:var(--font-mono);font-size:12px;color:#9a9a9a;text-decoration:none;border:1px solid #3a3a3a;border-radius:calc(var(--radius) - 2px);padding:5px 9px;white-space:nowrap}

/* ── BINDER TABS ── */
.site-nav{display:flex;gap:5px;overflow-x:auto;padding-top:14px}
.site-nav button{background:var(--paper2);border:1.5px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;padding:10px 15px;font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);cursor:pointer;white-space:nowrap;transform:translateY(3px);transition:transform .15s,background .15s,color .15s;display:inline-flex;align-items:center;gap:5px}
.site-nav button.active{background:var(--paper);color:var(--ink);transform:translateY(0);box-shadow:0 -2px 6px rgba(22,33,62,.08)}
.site-nav button .care{font-size:9px;transition:transform .15s}
.site-nav button.open .care{transform:rotate(180deg)}
.site-subnav{overflow:hidden;max-height:0;transition:max-height .22s ease}
.site-subnav.open{max-height:220px}
.site-subnav-inner{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 4px;border-bottom:1.5px solid var(--line)}
.site-subnav-inner button{background:var(--paper2);border:1.5px solid var(--line);border-radius:20px;padding:8px 16px;font-family:var(--font-mono);font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);cursor:pointer;white-space:nowrap}
.site-subnav-inner button.active{background:var(--red);border-color:var(--red);color:#fff}
.site-body{position:relative;background:var(--paper);border-top:1.5px solid var(--line);min-height:60vh;padding:28px 0 60px;overflow:hidden}
.site-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.site-watermark img{width:70%;max-width:640px;opacity:.06}
.site-body>.wrap{position:relative;z-index:1}
.rule-lines{background-image:repeating-linear-gradient(180deg, transparent, transparent 27px, var(--line-soft) 28px)}

/* ── STAMP ── */
.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;border:2px dashed currentColor;transform:rotate(-7deg);font-family:var(--font-mono);line-height:1;flex-shrink:0}
.stamp .d{font-size:21px;font-weight:700}
.stamp .m{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.stamp.gold{color:var(--gold)} .stamp.red{color:var(--red)} .stamp.ink{color:var(--ink2)}

/* ── HERO ── */
.hero{padding:34px 0 26px;text-align:center}
.hero .motto-stamp{display:inline-block;border:2px dashed var(--red);color:var(--red);font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:6px 16px;border-radius:30px;transform:rotate(-2deg);margin-bottom:16px}
.hero h1{font-size:clamp(28px,6vw,44px);font-style:normal;font-weight:800;max-width:680px;margin:0 auto}
.hero p.lead{max-width:520px;margin:14px auto 0;color:var(--ink2);font-size:16.5px;line-height:1.6}
.hero-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}

/* ── BUTTONS ── */
.btn{padding:11px 18px;border-radius:var(--radius);border:none;font-weight:700;cursor:pointer;font-family:var(--font-body);font-size:15.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-red{background:var(--red);color:#fff}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn-sm{padding:7px 12px;font-size:14px;border-radius:calc(var(--radius) - 1px)}
.btn:active{opacity:.82}

/* ── VISION & VALEURS ── */
.apropos-block{display:flex;gap:24px;flex-wrap:wrap;margin:30px 0 36px;padding:20px 0;border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line)}
.apropos-col{flex:1;min-width:220px}
.apropos-txt{font-size:16px;color:var(--ink2);line-height:1.65}

/* ── SECTION HEAD ── */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{font-size:24px}
.sec-head .eyebrow{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}

/* ── EVENT CARDS ── */
.evt-list{display:flex;flex-direction:column;gap:12px}
.evt-card{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:calc(var(--radius) - 2px);padding:14px;box-shadow:0 2px 8px rgba(22,33,62,.06)}
.evt-card .txt{flex:1;min-width:0}
.evt-card .txt h3{font-size:18px;font-weight:700;margin-bottom:4px}
.evt-card .txt .meta{font-family:var(--font-mono);font-size:13px;color:var(--ink2);margin-bottom:6px}
.evt-card .txt p{font-size:15px;color:var(--ink2);line-height:1.5}
.evt-card .txt .lnk{margin-top:8px}
.course-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:5px 11px;border-radius:20px}
.course-badge.attente{background:#fdf1d6;color:#9a6b00}
.course-badge.refuse{background:#fbe0e0;color:var(--red)}
.course-badge.valide{background:#dff3e6;color:#1a8f4c}
.course-lecon{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft)}
.course-lecon:first-child{border-top:none}
.course-lecon .ic{font-size:20px}
.course-lecon .info{flex:1;min-width:0}
.course-lecon .info .t{font-weight:700;font-size:14.5px}
.course-lecon .info .d{font-size:13px;color:var(--ink2)}
.actu-thumb{width:72px;height:72px;object-fit:cover;border-radius:calc(var(--radius) - 2px);flex-shrink:0}
.empty-note{text-align:center;color:var(--ink2);font-size:15.5px;padding:30px 10px;border:1.5px dashed var(--line);border-radius:var(--radius)}

/* ── GALLERY ── */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.team-card{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--radius) - 2px);padding:18px 14px;text-align:center;box-shadow:0 2px 8px rgba(22,33,62,.06)}
.team-avatar{width:100%;aspect-ratio:4/3;border-radius:calc(var(--radius) - 4px);border:2px dashed var(--gold);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--font-mono);font-weight:700;font-size:32px;color:var(--gold)}
.team-avatar img{width:100%;height:100%;object-fit:cover;border-radius:calc(var(--radius) - 6px)}
.team-card h3{font-size:16px;font-weight:700;margin-bottom:2px}
.team-role{font-family:var(--font-mono);font-size:12.5px;color:var(--red);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.team-bio{font-size:14px;color:var(--ink2);line-height:1.5;margin-bottom:10px}
.gallery-grid{column-count:2;column-gap:14px}
@media(min-width:640px){.gallery-grid{column-count:3}}
.gallery-item{position:relative;break-inside:avoid;margin-bottom:16px;background:var(--card);padding:7px 7px 12px;box-shadow:0 4px 12px rgba(22,33,62,.14);cursor:pointer}
.gallery-item img{width:100%;display:block;background:var(--paper2)}
.gallery-item .cap{font-size:13px;color:var(--ink2);margin-top:6px;padding:0 2px;font-family:var(--font-mono)}
.gallery-item::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-3deg);width:54px;height:20px;background:rgba(182,144,31,.32);border:1px solid rgba(182,144,31,.5)}
.lightbox{position:fixed;inset:0;background:rgba(22,33,62,.92);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px}
.lightbox img{max-width:92vw;max-height:78vh;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.lightbox .cap{color:var(--paper);font-family:var(--font-mono);font-size:14px}
.lightbox .close{position:absolute;top:16px;right:16px;background:none;border:1.5px solid var(--paper);color:var(--paper);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}

/* ── AVIS VISITEURS (fenêtre + bouton flottant) ── */
.avis-fab{position:fixed;right:18px;bottom:18px;z-index:900;background:var(--red);color:#fff;border:none;border-radius:30px;padding:13px 18px;font-family:var(--font-body);font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(255,90,60,.4);cursor:pointer;display:flex;align-items:center;gap:8px}
.wa-fab{position:fixed;left:18px;bottom:18px;z-index:900;background:#25D366;color:#fff;border:none;border-radius:50%;width:54px;height:54px;box-shadow:0 6px 18px rgba(37,211,102,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.wa-fab svg{width:28px;height:28px;fill:#fff}
.avis-overlay{position:fixed;inset:0;background:rgba(15,47,99,.55);z-index:998;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.avis-overlay{align-items:center}}
.avis-panel{background:var(--paper);width:100%;max-width:480px;max-height:82vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:640px){.avis-panel{border-radius:16px;max-height:74vh}}
.avis-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.avis-head h3{font-size:18px}
.avis-head .close{background:none;border:none;font-size:20px;color:var(--ink2);cursor:pointer;padding:4px 8px}
.avis-list{overflow-y:auto;padding:14px 18px;flex:1}
.avis-item{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.avis-item .nom{font-weight:700;font-size:15px}
.avis-item .txt{font-size:15.5px;color:var(--ink2);margin-top:2px}
.avis-item .reponse{margin-top:8px;background:var(--paper2);border-radius:var(--radius);padding:8px 10px;font-size:14.5px}
.avis-item .reponse b{color:var(--gold)}
.avis-form{padding:14px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.avis-form input,.avis-form textarea{border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;font-family:inherit;font-size:15.5px}
.avis-form textarea{resize:vertical;min-height:60px}

/* ── VIDEOS ── */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.video-card{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--radius) - 2px);overflow:hidden;box-shadow:0 2px 8px rgba(22,33,62,.06)}
.video-card .frame{position:relative;aspect-ratio:16/9;background:#000}
.hero-video{max-width:760px;margin:0 auto 30px;border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 28px rgba(22,33,62,.18)}
.hero-video .frame{position:relative;aspect-ratio:16/9;background:#000}
.hero-video .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cal-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.cal-item{flex:0 0 auto;min-width:150px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;cursor:pointer;box-shadow:0 2px 8px rgba(22,33,62,.06);transition:transform .12s}
.cal-item:hover{transform:translateY(-2px)}
.places-badge{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 10px;border-radius:20px;font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.02em}
.places-badge.ok{background:#eaf3ff;color:var(--gold)}
.places-badge.low{background:#fdecea;color:var(--red);animation:placesPulse 1.4s ease-in-out infinite}
.places-badge.full{background:var(--line);color:var(--ink2)}
@keyframes placesPulse{0%,100%{opacity:1}50%{opacity:.55}}
.cal-item.soon{border-color:var(--red)}
.cal-date{flex-shrink:0;width:46px;height:46px;border-radius:calc(var(--radius) - 2px);background:var(--paper2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-mono)}
.cal-item.soon .cal-date{background:var(--red);color:#fff}
.cal-date .d{font-size:18px;font-weight:700;line-height:1.1}
.cal-date .m{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.cal-title{font-size:15px;font-weight:700;line-height:1.25}
.cal-days{font-size:13px;color:var(--ink2);font-family:var(--font-mono);margin-top:2px}
.cal-item.soon .cal-days{color:var(--red);font-weight:700}
.video-card .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-card .info{padding:10px 12px}
.video-card .info h3{font-size:15.5px;font-weight:700}
.video-card .info p{font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.4}

/* ── FICHE FORM ── */
.fiche{background:var(--card);border:3px double var(--ink);border-radius:4px;padding:22px 20px;max-width:520px;margin:0 auto;position:relative}
.fiche .fiche-head{text-align:center;margin-bottom:18px}
.fiche .fiche-head .tag{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.fiche .fiche-head h2{font-size:22px;margin-top:4px}
label.f-label{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin-bottom:4px;margin-top:14px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em}
.fiche input,.fiche select,.fiche textarea{width:100%;padding:10px 11px;border:none;border-bottom:1.5px solid var(--line);background:transparent;font-size:16px;font-family:var(--font-body);outline:none;border-radius:0}
.fiche input:focus,.fiche select:focus,.fiche textarea:focus{border-bottom-color:var(--red)}
.fiche textarea{resize:vertical;min-height:60px}
.confirm-box{text-align:center;padding:20px 10px}
.confirm-box .stamp{width:96px;height:96px;margin:0 auto 14px}
.confirm-box .stamp .d{font-size:26px}

/* ── FOOTER ── */
.site-footer{background:var(--ink);color:#a8a8a8;padding:22px 0;text-align:center;font-size:14px}
.site-footer strong{color:var(--paper)}
.map-embed{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px rgba(22,33,62,.06)}

/* ── ADMIN ── */
.admin-shell{background:var(--paper2);min-height:100vh;padding-bottom:40px}
.admin-top{background:var(--ink);color:var(--paper);padding:14px 0}
.admin-top .row{display:flex;align-items:center;gap:10px}
.admin-top h1{color:var(--paper);font-size:18px;flex:1}
.admin-tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}
.admin-tabs button{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 13px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.admin-tabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.a-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.a-card h3{font-size:16.5px;margin-bottom:12px}
.a-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.a-row:last-child{border-bottom:none}
.a-row .main{flex:1;min-width:160px}
.a-row .main .t1{font-weight:700;font-size:15px}
.a-row .main .t2{font-size:13.5px;color:var(--ink2);margin-top:1px}
.chip{font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap;font-family:var(--font-mono)}
.chip-new{background:#fdecea;color:var(--red)}
.chip-contact{background:#fdf3e0;color:var(--gold)}
.chip-done{background:#e6f4ea;color:#1e7e34}
input.a-in,select.a-in,textarea.a-in{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:var(--radius);font-size:15px;font-family:var(--font-body);outline:none;margin-top:4px}
input.a-in:focus,select.a-in:focus,textarea.a-in:focus{border-color:var(--ink)}
label.a-label{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin-top:10px}

/* ── LOGIN / MISC ── */
.center-box{max-width:380px;margin:70px auto;text-align:center;padding:0 16px}
.center-box .stamp{width:80px;height:80px;margin:0 auto 16px}
.center-box p{color:var(--ink2);font-size:15.5px;margin-top:8px;line-height:1.5}
.center-box input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--radius);font-size:16px;margin-top:16px;text-align:center;font-family:var(--font-mono);letter-spacing:.1em}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:10px;font-size:15px;font-weight:600;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
/* ── MOBILE (téléphone) ── */
@media(max-width:480px){
  .wrap{padding:0 12px}
  .topbar{padding:12px 0}
  .topbar .row{flex-wrap:wrap}
  .brand-seal{height:46px;min-width:46px}
  .brand-txt .n{font-size:16.5px}
  .site-nav button{padding:9px 12px;font-size:12.5px}
  .hero{padding:26px 0 18px}
  .hero .lead{font-size:16px}
  .hero-actions{flex-direction:column;align-items:stretch}
  .hero-actions .btn{width:100%;justify-content:center}
  .evt-card{flex-direction:column;align-items:flex-start;padding:13px}
  .evt-card .stamp{margin-bottom:8px}
  .video-grid{grid-template-columns:1fr}
  .fiche{padding:18px 15px}
  .sec-head h2{font-size:21px}
}
@media(max-width:380px){
  .gallery-grid{column-count:1}
  .team-grid{grid-template-columns:repeat(2,1fr)}
}
.espace-hero{background:linear-gradient(135deg, var(--red), var(--gold));border-radius:var(--radius);padding:22px 20px;color:#fff;display:flex;align-items:center;gap:16px;margin-bottom:16px}
.espace-avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:800;font-size:20px;flex-shrink:0}
.espace-hero .t{font-size:19px;font-weight:800}
.espace-hero .d{font-size:13.5px;opacity:.9;margin-top:2px}
.espace-stat{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.espace-stat .ic{font-size:22px}
.espace-stat .n{font-size:24px;font-weight:800;line-height:1}
.espace-stat .l{font-size:12px;color:var(--ink2);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.03em}
.progress-track{background:var(--paper2);border-radius:20px;height:9px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg, var(--gold), var(--red));border-radius:20px;transition:width .4s ease}
.espace-matiere{border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.espace-matiere .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14.5px;font-weight:700}
.espace-matiere .pct{font-family:var(--font-mono);color:var(--gold);font-weight:800}

/* ── Mode sombre : appliqué immédiatement, mémorisé sur l'appareil ── */
function initTheme(){
  const saved = localStorage.getItem('cre_theme');
  const preferDark = saved ? saved==='dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', preferDark ? 'dark' : 'light');
  const mc = document.querySelector('meta[name=theme-color]');
  if(mc) mc.setAttribute('content', preferDark ? '#0D0D0D' : '#161616');
}
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('cre_theme', next);
  const mc = document.querySelector('meta[name=theme-color]');
  if(mc) mc.setAttribute('content', next==='dark' ? '#0D0D0D' : '#161616');
}
initTheme();

let toastTimeout;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>t.classList.remove('show'), 2400);
}
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDay(ts){ return new Date(ts).toLocaleDateString('fr-FR',{day:'2-digit'}); }
function fmtMon(ts){ return new Date(ts).toLocaleDateString('fr-FR',{month:'short'}).replace('.',''); }
function fmtFull(ts){ return new Date(ts).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}); }
function ytId(url){
  if(!url) return '';
  const m = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : url.trim();
}
function waLink(tel){
  let d = (tel||'').replace(/\D/g,'');
  if(d.length===9) d = '224'+d;
  return `https://wa.me/${d}`;
}
function waWelcomeLink(tel, prenom){
  const msg = `Bonjour ${prenom} 👋 Bienvenue au Club Réussir Ensemble !\n\nNous sommes ravis de t'accueillir parmi nous. Rigueur · Discipline · Travail — ensemble on va réussir 💪\n\nUn formateur reviendra vers toi très bientôt avec les prochaines étapes. À très vite !`;
  return `${waLink(tel)}?text=${encodeURIComponent(msg)}`;
}

  non_retenu: `Bonjour {prenom},\n\nMerci pour ton intérêt pour le Club Réussir Ensemble. Après étude de ta fiche d'inscription, nous ne sommes malheureusement pas en mesure de te retenir pour cette session.\n\nNous t'encourageons vivement à retenter ta chance lors d'une prochaine ouverture. Merci de ta compréhension.`
};
async function loadMsgTemplates(){
  try{
    const snap = await getDoc(doc(fbDB, C_CONFIG, 'messages'));
    if(snap.exists()){ const d = snap.data(); if(d.retenu) msgTemplates.retenu = d.retenu; if(d.non_retenu) msgTemplates.non_retenu = d.non_retenu; }
  }catch(e){}
}
function decisionMsg(prenom, decision){
  const tpl = decision==='retenu' ? msgTemplates.retenu : msgTemplates.non_retenu;
  return tpl.replace(/\{prenom\}/g, prenom||'');
}
function decisionWaLink(tel, prenom, decision){
  return `${waLink(tel)}?text=${encodeURIComponent(decisionMsg(prenom, decision))}`;
}
function decisionMailLink(email, prenom, decision){
  const subject = decision==='retenu' ? 'Club Réussir Ensemble — Vous êtes retenu(e) !' : 'Club Réussir Ensemble — Votre candidature';
  return `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(decisionMsg(prenom, decision))}`;
}
function decisionSmsLink(tel, prenom, decision){
  let d = (tel||'').replace(/\D/g,'');
  if(d.length===9) d = '224'+d;
  return `sms:${d}?body=${encodeURIComponent(decisionMsg(prenom, decision))}`;
}

/* ── PDF : liste des élèves retenus ── */
function generatePdfRetenus(retenus){
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF){ toast("❌ Le générateur PDF n'a pas pu se charger — vérifiez la connexion internet"); return; }
  const docPdf = new jsPDF();
  const dateStr = new Date().toLocaleDateString('fr-FR', {day:'2-digit',month:'long',year:'numeric'});

  docPdf.setFontSize(16);
  docPdf.setFont(undefined,'bold');
  docPdf.text('Club Réussir Ensemble', 14, 18);
  docPdf.setFontSize(11);
  docPdf.setFont(undefined,'normal');
  docPdf.text('Rigueur · Discipline · Travail', 14, 25);
  docPdf.setFontSize(13);
  docPdf.setFont(undefined,'bold');
  docPdf.text('Liste des élèves retenus', 14, 35);
  docPdf.setFontSize(10);
  docPdf.setFont(undefined,'normal');
  docPdf.text(`Établie le ${dateStr} — ${retenus.length} élève${retenus.length>1?'s':''} retenu${retenus.length>1?'s':''}`, 14, 41);

  const rows = retenus
    .slice()
    .sort((a,b)=> (a.nom||'').localeCompare(b.nom||''))
    .map((r,i)=> [i+1, esc0(r.nom), esc0(r.prenom), esc0(r.classe), esc0(r.filiere)||'—', esc0(r.telephone)]);

  docPdf.autoTable({
    startY: 47,
    head: [['#','Nom','Prénom','Classe','Filière','Téléphone']],
    body: rows,
    styles: { fontSize: 10, cellPadding: 3 },
    headStyles: { fillColor: [255,90,60] },
    theme: 'grid'
  });

  const finalY = (docPdf.lastAutoTable && docPdf.lastAutoTable.finalY) || 47;
  docPdf.setFontSize(9);
  docPdf.setTextColor(120);
  docPdf.text('Document généré automatiquement depuis le site du Club Réussir Ensemble.', 14, finalY + 12);

  docPdf.save(`Club_Reussir_Ensemble_Retenus_${new Date().toISOString().slice(0,10)}.pdf`);
}
function esc0(s){ return (s??'').toString(); }

};

function loadGoogleFont(name){
  if(!name || GOOGLE_FONT_URL_NAME[name]===undefined) return;
  const id = 'gf-'+name.replace(/[^a-z0-9]/gi,'-');
  if(document.getElementById(id)) return; // déjà chargée
  const link = document.createElement('link');
  link.id = id; link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${GOOGLE_FONT_URL_NAME[name]}&display=swap`;
  document.head.appendChild(link);
}

function applyTheme(theme){
  const t = { ...DEFAULT_THEME, ...(theme||{}) };
  const root = document.documentElement.style;
  root.setProperty('--ink', t.ink);
  root.setProperty('--ink2', t.ink2);
  root.setProperty('--paper', t.paper);
  root.setProperty('--paper2', t.paper2);
  root.setProperty('--red', t.red);
  root.setProperty('--gold', t.gold);
  loadGoogleFont(t.fontTitle);
  loadGoogleFont(t.fontBody);
  root.setProperty('--font-title', FONT_TITLE_OPTIONS[t.fontTitle] || `'${t.fontTitle}', serif`);
  root.setProperty('--font-body', FONT_BODY_OPTIONS[t.fontBody] || `'${t.fontBody}', sans-serif`);
  root.setProperty('--radius', (t.radius ?? '8') + 'px');
}

let sealClicks = 0, sealClickTimer, sealLastTap = 0;
function wireAdminTrigger(){
  const seal = document.querySelector('.topbar .brand-seal');
  if(!seal) return;
  seal.style.cursor = 'pointer';
  seal.style.touchAction = 'manipulation'; // évite le double-tap zoom
  seal.style.position = 'relative';
  // zone de tap invisible plus grande que le rond visible, plus facile à toucher
  const hit = document.createElement('div');
  hit.style.cssText = 'position:absolute;inset:-14px;';
  seal.appendChild(hit);

  const trigger = (e)=>{
    if(e) e.preventDefault();
    const now = Date.now();
    if(now - sealLastTap > 3000){ sealClicks = 0; }
    sealLastTap = now;
    sealClicks++;
    clearTimeout(sealClickTimer);
    sealClickTimer = setTimeout(()=>{ sealClicks = 0; }, 3000);
    if(sealClicks >= 5){
      sealClicks = 0;
      location.href = location.pathname + '?admin=1';
    }
  };

  // pointerup couvre tactile + souris en un seul événement, plus fiable que touchend/click séparés
  hit.addEventListener('pointerup', trigger);
  seal.addEventListener('pointerup', trigger);
}

let openNavGroup = null;
function paintNav(){
  const NAV = [
    ['accueil','Accueil'],
    ['actus','Actualités'],
    {group:'evt', label:'Événements', children:[['evenements','Événements'],['sessions','Sessions']]},
    {group:'med', label:'Médias', children:[['galerie','Galerie'],['videos','Vidéos']]},
    {group:'club', label:'Le Club', children:[['equipe','Équipe'],['temoignages','Témoignages']]},
    ['cours','Cours en ligne'],
    ['inscription','Inscription'],
  ];
  const groupOf = (k)=> { for(const it of NAV){ if(it.children && it.children.some(c=>c[0]===k)) return it; } return null; };
  document.getElementById('siteNav').innerHTML = NAV.map(item=>{
    if(item.children){
      const containsActive = item.children.some(c=>c[0]===siteTab);
      const isOpen = openNavGroup===item.group;
      return `<button class="${containsActive?'active':''} ${isOpen?'open':''}" data-group="${item.group}">${item.label}<span class="care">▾</span></button>`;
    }
    const [k,l] = item;
    return `<button class="${siteTab===k?'active':''}" data-tab="${k}">${l}</button>`;
  }).join('');

  document.getElementById('siteNav').querySelectorAll('button[data-tab]').forEach(b=>{
    b.onclick = ()=>{ siteTab = b.dataset.tab; openNavGroup = null; paintNav(); renderSiteTab(); };
  });
  document.getElementById('siteNav').querySelectorAll('button[data-group]').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); openNavGroup = openNavGroup===b.dataset.group ? null : b.dataset.group; paintNav(); };
  });

  const subnav = document.getElementById('siteSubnav');
  const inner = document.getElementById('siteSubnavInner');
  const openItem = NAV.find(it=>it.children && it.group===openNavGroup);
  if(openItem){
    inner.innerHTML = openItem.children.map(([k,l])=>
      `<button class="${siteTab===k?'active':''}" data-tab="${k}">${l}</button>`).join('');
    inner.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ siteTab = b.dataset.tab; openNavGroup = null; paintNav(); renderSiteTab(); };
    });
    subnav.classList.add('open');
  } else {
    subnav.classList.remove('open');
    inner.innerHTML = '';
  }
}
document.addEventListener('click', (e)=>{
  if(openNavGroup && !e.target.closest('#siteNav') && !e.target.closest('#siteSubnav')){
    openNavGroup = null; paintNav();
  }
});

let leafletLoadPromise = null;
function loadLeaflet(){
  if(leafletLoadPromise) return leafletLoadPromise;
  leafletLoadPromise = new Promise((resolve, reject)=>{
    if(window.L){ resolve(); return; }
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.async = true;
    s.onload = ()=> resolve();
    s.onerror = ()=> reject(new Error('Impossible de charger Leaflet'));
    document.head.appendChild(s);
  });
  return leafletLoadPromise;
}
async function geocodeAdresse(adresse){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(adresse)}`;
  const res = await fetch(url, { headers: { 'Accept':'application/json' } });
  const data = await res.json();
  if(!data.length) throw new Error('Adresse introuvable');
  return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
}
function contactMapFallback(el, adresse){
  el.innerHTML = `<iframe src="https://www.google.com/maps?q=${encodeURIComponent(adresse)}&output=embed" width="100%" height="320" style="border:0;display:block" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Localisation du Club Réussir Ensemble"></iframe>`;
}
async function renderContactMap(){
  const el = document.getElementById('gmap');
  if(!el) return;
  const adresse = (siteConfig.adresse||'').trim() || 'Mamou, Guinée';
  try{
    await loadLeaflet();
    let lat = (siteConfig.lat!=null && siteConfig.lat!=='') ? Number(siteConfig.lat) : null;
    let lng = (siteConfig.lng!=null && siteConfig.lng!=='') ? Number(siteConfig.lng) : null;
    if(lat==null || lng==null || isNaN(lat) || isNaN(lng)){
      const loc = await geocodeAdresse(adresse);
      lat = loc.lat; lng = loc.lng;
    }
    el.innerHTML = '';
    const map = L.map(el, { scrollWheelZoom:false }).setView([lat, lng], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(map);
    const icon = L.divIcon({
      className: '', html: `<div style="width:26px;height:26px;border-radius:50%;background:#E4132B;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>`,
      iconSize: [26,26], iconAnchor: [13,13]
    });
    L.marker([lat, lng], { icon }).addTo(map).bindPopup('Club Réussir Ensemble').openPopup();
    setTimeout(()=> map.invalidateSize(), 200);
  }catch(err){
    contactMapFallback(el, adresse);
  }
}

function daysUntil(ts){
  const ms = ts - Date.now();
  return Math.ceil(ms / 86400000);
}
function placesBadge(s){
  if(s.placesTotal==null || s.placesTotal==='') return '';
  const restantes = (s.placesRestantes!=null && s.placesRestantes!=='') ? Number(s.placesRestantes) : Number(s.placesTotal);
  if(restantes<=0) return `<div class="places-badge full">🚫 Complet — plus de places disponibles</div>`;
  if(restantes<=5) return `<div class="places-badge low">🔥 Il reste ${restantes} place${restantes>1?'s':''} seulement !</div>`;
  return `<div class="places-badge ok">🎟️ Il reste ${restantes} place${restantes>1?'s':''}</div>`;
}
function sessCard(s){

  const accesAttente = matieres.filter(m => {
    const p = mesPaiements.filter(pp=>pp.matiereId===m.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
    return p && p.statut==='attente';
  });

  const nbQuiz = mesQuizResultats.length;
  const moyenneQuiz = nbQuiz ? Math.round(mesQuizResultats.reduce((s,r)=> s + (r.total? (r.score/r.total*100) : 0), 0) / nbQuiz) : null;

  const nbDevoirs = mesDevoirsSoumissions.length;
  const devoirsCorriges = mesDevoirsSoumissions.filter(d=>d.statut==='corrige');
  const devoirsAttente = mesDevoirsSoumissions.filter(d=>d.statut!=='corrige');
  const moyenneDevoirs = devoirsCorriges.length ? (devoirsCorriges.reduce((s,d)=> s + (Number(d.note)||0), 0) / devoirsCorriges.length) : null;

  const derniersQuiz = mesQuizResultats.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,5);
  const derniersDevoirs = mesDevoirsSoumissions.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,5);

  const progressionMatieres = accesValides.map(m=>{
    const evaluables = (m.lecons||[]).filter(l=>l.type==='quiz'||l.type==='devoir');
    const done = evaluables.filter(l=> l.type==='quiz'
      ? mesQuizResultats.some(r=>r.leconId===l.id)
      : mesDevoirsSoumissions.some(d=>d.leconId===l.id)).length;
    const pct = evaluables.length ? Math.round(done/evaluables.length*100) : null;
    return { m, done, total: evaluables.length, pct };
  });

  return `
  <div class="espace-hero">
    <div class="espace-avatar">${esc(initiales)}</div>
    <div>
      <div class="t">Bonjour ${esc(nom)} 👋</div>
      ${inscritDepuis?`<div class="d">Membre depuis le ${fmtFull(inscritDepuis.getTime())}</div>`:''}
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
    <div class="espace-stat"><div class="ic">🎓</div><div class="n">${accesValides.length}</div><div class="l">Matière${accesValides.length>1?'s':''} active${accesValides.length>1?'s':''}${accesAttente.length?` (+${accesAttente.length} en attente)`:''}</div></div>
    <div class="espace-stat"><div class="ic">📝</div><div class="n">${nbQuiz}</div><div class="l">QCM passés${moyenneQuiz!==null?` · ${moyenneQuiz}%`:''}</div></div>
    <div class="espace-stat"><div class="ic">📚</div><div class="n">${nbDevoirs}</div><div class="l">Devoirs rendus${moyenneDevoirs!==null?` · ${moyenneDevoirs.toFixed(1)}/20`:''}</div></div>
    <div class="espace-stat"><div class="ic">⏳</div><div class="n">${devoirsAttente.length}</div><div class="l">En attente de correction</div></div>
  </div>

  ${progressionMatieres.length ? `
  <div class="evt-card" style="flex-direction:column;align-items:stretch">
    <h3>🎯 Ma progression par matière</h3>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
      ${progressionMatieres.map(({m,done,total,pct})=>`
        <div class="espace-matiere">
          <div class="top"><span>${esc(m.nom)}</span>${pct!==null?`<span class="pct">${pct}%</span>`:''}</div>
          ${pct!==null ? `
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div style="font-size:12.5px;color:var(--ink2);margin-top:4px">${done}/${total} évaluation${total>1?'s':''} complétée${done>1?'s':''}</div>
          ` : `<div style="font-size:12.5px;color:var(--ink2);margin-top:4px">Pas encore d'évaluation publiée pour cette matière</div>`}
        </div>`).join('')}
    </div>
  </div>` : `<div class="empty-note">Vous n'avez encore accès à aucune matière — rendez-vous dans "Mes matières" pour vous inscrire.</div>`}

  ${derniersQuiz.length ? `
  <div class="evt-card" style="flex-direction:column;align-items:stretch">
    <h3>📝 Derniers résultats de QCM</h3>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
      ${derniersQuiz.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:14.5px">
        <span>${esc(r.matiereNom||'')} — ${esc(r.leconTitre||'')}</span><span><b>${r.score}/${r.total}</b></span>
      </div>`).join('')}
    </div>
  </div>` : ''}

  ${derniersDevoirs.length ? `
  <div class="evt-card" style="flex-direction:column;align-items:stretch">
    <h3>📚 Derniers devoirs</h3>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
      ${derniersDevoirs.map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:14.5px">
        <span>${esc(d.matiereNom||'')} — ${esc(d.leconTitre||'')}</span>
        <span>${d.statut==='corrige' ? `<b>${d.note}/20</b>` : '<span class="course-badge attente">⏳</span>'}</span>
      </div>`).join('')}
    </div>
  </div>` : ''}`;
}

function tplMatiereCard(m){
  const p = mesPaiements.filter(pp=>pp.matiereId===m.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  const statut = p ? p.statut : null;
  const prixTxt = m.prix ? `${Number(m.prix).toLocaleString('fr-FR')} GNF` : 'Gratuit';
  let statusHtml = '';
  if(statut==='valide'){
    statusHtml = `<span class="course-badge valide">✅ Accès actif</span>`;
  } else if(statut==='attente'){
    statusHtml = `<span class="course-badge attente">⏳ Paiement en attente de validation</span>`;
  } else if(statut==='refuse'){
    statusHtml = `<span class="course-badge refuse">❌ Paiement refusé</span> <button class="btn btn-red btn-sm" data-pay="${m.id}" style="margin-top:8px">Réessayer le paiement</button>`;
  } else {
    statusHtml = `<button class="btn btn-red btn-sm" data-pay="${m.id}">S'inscrire — ${prixTxt}</button>`;
  }
  const lecons = statut==='valide' ? (m.lecons||[]).slice().sort((a,b)=>(a.ordre??999)-(b.ordre??999)) : [];
  return `
  <div class="evt-card" style="flex-direction:column;align-items:stretch">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
      <div><h3>${esc(m.nom)}</h3>${m.prof?`<div class="meta">Encadré par ${esc(m.prof)}</div>`:''}</div>
      <div>${statusHtml}</div>
    </div>
    ${m.description?`<p>${esc(m.description)}</p>`:''}
    ${statut==='valide' ? `
      <div style="margin-top:10px">
        ${lecons.length ? lecons.map(l=>tplLecon(l, m.id)).join('') : '<div class="empty-note">Aucune leçon publiée pour le moment.</div>'}
      </div>` : ''}
  </div>`;
}

function tplLecon(l, matiereId){
  if(l.type==='video'){
    return `<div class="course-lecon"><div class="ic">🎬</div><div class="info"><div class="t">${esc(l.titre)}</div>
      <div class="d"><a href="${esc(l.url)}" target="_blank" rel="noopener">Regarder la vidéo →</a></div></div></div>`;
  }
  if(l.type==='pdf'){
    return `<div class="course-lecon"><div class="ic">📄</div><div class="info"><div class="t">${esc(l.titre)}</div>
      <div class="d"><a href="${esc(l.url)}" target="_blank" rel="noopener">Ouvrir le document →</a></div></div></div>`;
  }
  if(l.type==='quiz') return tplQuizLecon(l, matiereId);
  if(l.type==='devoir') return tplDevoirLecon(l, matiereId);
  return `<div class="course-lecon"><div class="ic">🔴</div><div class="info"><div class="t">${esc(l.titre)}</div>
    <div class="d">Session en direct — ${l.date?fmtFull(l.date):'date à venir'}${l.url?` · <a href="${esc(l.url)}" target="_blank" rel="noopener">Rejoindre →</a>`:''}</div></div></div>`;
}

function tplQuizLecon(l, matiereId){
  const questions = l.questions||[];
  const dernier = mesQuizResultats.filter(r=>r.leconId===l.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  const isOpen = openQuiz && openQuiz.leconId===l.id;
  if(isOpen){
    return `
    <div class="course-lecon" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;gap:10px;align-items:center"><div class="ic">📝</div><div class="info"><div class="t">${esc(l.titre)}</div></div></div>
      <form data-quizform="${matiereId}|${l.id}" style="margin-top:10px;display:flex;flex-direction:column;gap:14px">
        ${questions.map((q,qi)=>`
          <div>
            <div style="font-weight:700;font-size:14.5px;margin-bottom:6px">${qi+1}. ${esc(q.texte)}</div>
            ${q.options.map((o,oi)=>`
              <label style="display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0">
                <input type="radio" name="q${qi}" value="${oi}" required> ${esc(o)}
              </label>`).join('')}
          </div>`).join('')}
        <div style="display:flex;gap:8px">
          <button type="submit" class="btn btn-red btn-sm">Valider mes réponses</button>
          <button type="button" class="btn btn-outline btn-sm" data-cancelquiz="1">Annuler</button>
        </div>
      </form>
    </div>`;
  }
  return `
  <div class="course-lecon">
    <div class="ic">📝</div>
    <div class="info"><div class="t">${esc(l.titre)}</div>
      <div class="d">${questions.length} question(s)${dernier?` · Dernier score : <b>${dernier.score}/${dernier.total}</b>`:''}</div>
    </div>
    <button class="btn btn-outline btn-sm" data-startquiz="${matiereId}|${l.id}">${dernier?'Repasser le QCM':'Commencer le QCM'}</button>
  </div>`;
}

function tplDevoirLecon(l, matiereId){
  const soum = mesDevoirsSoumissions.filter(s=>s.leconId===l.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  let statusHtml;
  if(!soum){
    statusHtml = `
      <form data-devoirform="${matiereId}|${l.id}" style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
        <textarea class="a-in" name="contenu" rows="3" placeholder="Votre réponse, ou collez ici le lien de votre fichier (Google Drive, photo...)" required></textarea>
        <button type="submit" class="btn btn-red btn-sm" style="align-self:flex-start">Rendre le devoir</button>
      </form>`;
  } else if(soum.statut==='corrige'){
    statusHtml = `<div class="course-badge valide">✅ Noté : ${soum.note}/20</div>${soum.commentaire?`<div class="d" style="margin-top:6px">💬 ${esc(soum.commentaire)}</div>`:''}`;
  } else {
    statusHtml = `<span class="course-badge attente">⏳ En attente de correction</span>`;
  }
  return `
  <div class="course-lecon" style="flex-direction:column;align-items:stretch">
    <div style="display:flex;gap:10px;align-items:flex-start"><div class="ic">📚</div>
      <div class="info"><div class="t">${esc(l.titre)}</div>
        ${l.consignes?`<div class="d">${esc(l.consignes)}</div>`:''}
        ${l.url?`<div class="d"><a href="${esc(l.url)}" target="_blank" rel="noopener">📎 Voir le sujet →</a></div>`:''}
        ${l.dateLimite?`<div class="d">À rendre avant le ${fmtFull(l.dateLimite)}</div>`:''}
      </div>
    </div>
    <div style="margin-top:6px">${statusHtml}</div>
  </div>`;
}

function openPayModal(matiereId){
  const m = matieres.find(x=>x.id===matiereId);
  if(!m) return;
  const prixTxt = m.prix ? `${Number(m.prix).toLocaleString('fr-FR')} GNF` : 'Gratuit';
  const overlay = document.createElement('div');
  overlay.className = 'avis-overlay';
  overlay.innerHTML = `
    <div class="avis-panel">
      <div class="avis-head"><h3>💳 Paiement — ${esc(m.nom)}</h3><button class="close" aria-label="Fermer">✕</button></div>
      <div style="padding:16px 18px 4px">
        <p style="font-size:14.5px;color:var(--ink2);margin-bottom:10px">Montant à payer : <b>${prixTxt}</b></p>
        <p style="font-size:14.5px;color:var(--ink2);margin-bottom:14px">1. Envoyez ce montant via <b>${esc(COURS_MOMO_OPERATEUR)}</b> au numéro <b>${esc(COURS_MOMO_NUM)}</b>.<br>2. Indiquez ci-dessous la référence de la transaction reçue par SMS.<br>3. Votre accès sera activé après validation par l'administration (généralement sous 24h).</p>
      </div>
      <form class="avis-form" id="payForm">
        <input type="tel" name="telephone" placeholder="Votre numéro de téléphone" required>
        <input type="text" name="reference" placeholder="Référence de la transaction" required>
        <button type="submit" class="btn btn-red" style="justify-content:center">Envoyer ma preuve de paiement</button>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  const closeIt = ()=> overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) closeIt(); };
  overlay.querySelector('.close').onclick = closeIt;
  overlay.querySelector('#payForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Envoi...';
    try{
      await addDoc(collection(fbDB, C_PAIEMENTS), {
        uid: currentUser.uid, eleveEmail: currentUser.email, eleveNom: currentUser.displayName||'',
        matiereId: m.id, matiereNom: m.nom, montant: m.prix||0,
        telephone: fd.get('telephone').trim(), reference: fd.get('reference').trim(),
        statut: 'attente', createdAt: Date.now()
      });
      toast('✅ Preuve envoyée — en attente de validation');
      closeIt();
    }catch(err){ toast('❌ '+err.message); btn.disabled=false; btn.textContent="Envoyer ma preuve de paiement"; }
  });
}

function wireCoursBody(){
  if(!currentUser){
    document.getElementById('modeLogin').onclick = ()=>{ coursAuthMode='login'; renderSiteTab(); };
    document.getElementById('modeSignup').onclick = ()=>{ coursAuthMode='signup'; renderSiteTab(); };
    document.getElementById('coursAuthForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const email = fd.get('email').trim(), password = fd.get('password');
      const errEl = document.getElementById('coursAuthErr');
      errEl.textContent = '';
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      try{
        if(coursAuthMode==='login'){
          await signInWithEmailAndPassword(fbAuth, email, password);
        } else {
          const prenom = fd.get('prenom').trim(), nom = fd.get('nom').trim(), telephone = fd.get('telephone').trim();
          const cred = await createUserWithEmailAndPassword(fbAuth, email, password);
          await updateProfile(cred.user, { displayName: `${prenom} ${nom}` });
          await setDoc(doc(fbDB, 'site_eleves', cred.user.uid), { uid: cred.user.uid, prenom, nom, telephone, email, createdAt: Date.now() });
        }
      }catch(err){
        errEl.textContent = traduireErreurAuth(err.code);
        btn.disabled = false;
      }
    });
    return;
  }
  document.getElementById('coursLogout').onclick = ()=> signOut(fbAuth);
  document.querySelectorAll('[data-cours-sub-tab]').forEach(b=>{
    b.onclick = ()=>{ coursSubTab = b.dataset.coursSubTab; renderSiteTab(); };
  });
  document.querySelectorAll('[data-pay]').forEach(b=>{
    b.onclick = ()=> openPayModal(b.dataset.pay);
  });
  document.querySelectorAll('[data-startquiz]').forEach(b=>{
    b.onclick = ()=>{ const [matiereId, leconId] = b.dataset.startquiz.split('|'); openQuiz = {matiereId, leconId}; renderSiteTab(); };
  });
  document.querySelectorAll('[data-cancelquiz]').forEach(b=>{
    b.onclick = ()=>{ openQuiz = null; renderSiteTab(); };
  });
  document.querySelectorAll('[data-quizform]').forEach(f=>{
    f.addEventListener('submit', async e=>{
      e.preventDefault();
      const [matiereId, leconId] = f.dataset.quizform.split('|');
      const m = matieres.find(x=>x.id===matiereId);
      const lecon = m ? (m.lecons||[]).find(l=>l.id===leconId) : null;
      if(!lecon) return;
      const fd = new FormData(f);
      let score = 0;
      lecon.questions.forEach((q,qi)=>{ if(parseInt(fd.get('q'+qi),10)===q.correct) score++; });
      try{
        await addDoc(collection(fbDB, C_QUIZ_RES), {
          uid: currentUser.uid, eleveNom: currentUser.displayName||currentUser.email,
          matiereId, matiereNom: m.nom, leconId, leconTitre: lecon.titre,
          score, total: lecon.questions.length, createdAt: Date.now()
        });
        toast(`✅ Score : ${score}/${lecon.questions.length}`);
        openQuiz = null; renderSiteTab();
      }catch(err){ toast('❌ '+err.message); }
    });
  });
  document.querySelectorAll('[data-devoirform]').forEach(f=>{
    f.addEventListener('submit', async e=>{
      e.preventDefault();
      const [matiereId, leconId] = f.dataset.devoirform.split('|');
      const m = matieres.find(x=>x.id===matiereId);
      const lecon = m ? (m.lecons||[]).find(l=>l.id===leconId) : null;
      const fd = new FormData(f);
      const btn = f.querySelector('button[type=submit]');
      btn.disabled = true;
      try{
        await addDoc(collection(fbDB, C_DEVOIRS), {
          uid: currentUser.uid, eleveNom: currentUser.displayName||currentUser.email,
          matiereId, matiereNom: m?m.nom:'', leconId, leconTitre: lecon?lecon.titre:'',
          contenu: fd.get('contenu').trim(), statut: 'attente', createdAt: Date.now()
        });
        toast('✅ Devoir envoyé'); renderSiteTab();
      }catch(err){ toast('❌ '+err.message); btn.disabled=false; }
    });
  });
}

function traduireErreurAuth(code){
  const map = {
    'auth/email-already-in-use': 'Un compte existe déjà avec cet email.',
    'auth/invalid-email': 'Adresse email invalide.',
    'auth/weak-password': 'Mot de passe trop court (6 caractères minimum).',
    'auth/user-not-found': 'Aucun compte avec cet email.',
    'auth/wrong-password': 'Mot de passe incorrect.',
    'auth/invalid-credential': 'Email ou mot de passe incorrect.',
  };
  return map[code] || 'Une erreur est survenue. Veuillez réessayer.';
}


function wireSiteBody(){
  document.querySelectorAll('#siteBody [data-tab]').forEach(el=>{
    if(el.tagName==='BUTTON' && el.dataset.tab && !el.hasAttribute('onclick')){
      el.onclick = ()=>{ siteTab = el.dataset.tab; paintNav(); renderSiteTab(); window.scrollTo(0,0); };
    }
  });
  document.querySelectorAll('.cal-item[data-tab]').forEach(el=>{
    el.onclick = ()=>{ siteTab = el.dataset.tab; paintNav(); renderSiteTab(); window.scrollTo(0,0); };
  });
  document.querySelectorAll('.gallery-item').forEach(el=>{
    el.onclick = ()=> openLightbox(el.dataset.url, el.dataset.cap);
  });
  const form = document.getElementById('inscForm');
  if(form){
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(form);
      const data = {
        nom: fd.get('nom').trim(), prenom: fd.get('prenom').trim(),
        telephone: fd.get('telephone').trim(), email: (fd.get('email')||'').trim(), classe: fd.get('classe').trim(),
        filiere: (fd.get('filiere')||'').trim(), message: (fd.get('message')||'').trim(),
        statut: 'nouveau', decision: 'en_attente', dateInscription: Date.now()
      };
      const btn = form.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Envoi...';
      try{
        await addDoc(collection(fbDB, C_INSC), data);
        document.getElementById('siteBody').innerHTML = `
          <div class="confirm-box">
            <div class="stamp red"><div class="d">✔</div><div class="m">Reçu</div></div>
            <h2>Merci, ${esc(data.prenom)} !</h2>
            <p>Votre fiche d'inscription a bien été reçue. Un formateur du club vous contactera très bientôt sur WhatsApp.</p>
            <div class="hero-actions" style="margin-top:18px"><button class="btn btn-outline" data-tab="accueil" onclick="location.reload()">Retour à l'accueil</button></div>
          </div>`;
      }catch(err){ toast('❌ Erreur : '+err.message); btn.disabled=false; btn.textContent='Envoyer ma fiche'; }
    });
  }
}

function openLightbox(url, cap){
  const lb = document.createElement('div');
  lb.className = 'lightbox';

let avisUnsub = null;
function openAvisPanel(){
  const overlay = document.createElement('div');
  overlay.className = 'avis-overlay';
  overlay.innerHTML = `
    <div class="avis-panel">
      <div class="avis-head"><h3>💬 Exprimez-vous</h3><button class="close" aria-label="Fermer">✕</button></div>
      <div class="avis-list" id="avisList"><div class="spinner"></div></div>
      <form class="avis-form" id="avisForm">
        <input type="text" name="nom" aria-label="Votre nom (optionnel)" placeholder="Votre nom (optionnel)" maxlength="60">
        <textarea name="texte" aria-label="Votre avis, question ou message" placeholder="Votre avis, question ou message..." required maxlength="500"></textarea>
        <button type="submit" class="btn btn-red" style="justify-content:center">Envoyer</button>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  const closeIt = ()=>{ if(avisUnsub){ avisUnsub(); avisUnsub=null; } overlay.remove(); };
  overlay.onclick = e=>{ if(e.target===overlay) closeIt(); };
  overlay.querySelector('.close').onclick = closeIt;

  const list = overlay.querySelector('#avisList');
  avisUnsub = onSnapshot(query(collection(fbDB, C_AVIS), orderBy('createdAt','desc')), snap=>{
    const items = snap.docs.map(d=>({id:d.id,...d.data()}));
    list.innerHTML = items.length ? items.map(a=>`
      <div class="avis-item">
        <div class="nom">${esc(a.nom||'Anonyme')}</div>
        <div class="txt">${esc(a.texte)}</div>
        ${a.reponse ? `<div class="reponse"><b>Réponse du club :</b> ${esc(a.reponse)}</div>` : ''}
      </div>`).join('') : '<div class="empty-note">Soyez le premier à laisser un message !</div>';
  });

  overlay.querySelector('#avisForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const form = e.target;
    const fd = new FormData(form);
    const texte = fd.get('texte').trim();
    if(!texte) return;
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Envoi...';
    try{
      await addDoc(collection(fbDB, C_AVIS), { nom: (fd.get('nom')||'').trim(), texte, reponse:'', createdAt: Date.now() });
      form.reset();
      toast('✅ Message envoyé, merci !');
    }catch(err){ toast('❌ Erreur : '+err.message); }
    btn.disabled = false; btn.textContent = 'Envoyer';
  });
}

/* Connexion via Firebase Auth (même compte admin que les autres apps du Club,
   vérifié via la collection "admins" partagée par le projet emploi-temps). */
function bootAdmin(){
  if(fbAuth.currentUser){ checkAdminAndEnter(fbAuth.currentUser); return; }
  app.innerHTML = `
    <div class="center-box">
      <div class="stamp ink"><div class="d">🔒</div></div>
      <h2>Espace admin</h2>
      <p>Connectez-vous avec votre compte administrateur pour gérer le contenu du site.</p>
      <input type="email" id="adminEmail" placeholder="Email" autocomplete="username" autofocus>
      <input type="password" id="adminPass" placeholder="Mot de passe" autocomplete="current-password" style="margin-top:8px">
      <div class="hero-actions" style="margin-top:14px"><button class="btn btn-ink" id="adminLoginBtn">Se connecter</button></div>
      <p id="adminLoginErr" style="color:#c0392b;font-size:13px;margin-top:10px"></p>
    </div>`;
  const go = async ()=>{
    const email = document.getElementById('adminEmail').value.trim();
    const pass  = document.getElementById('adminPass').value;
    const errEl = document.getElementById('adminLoginErr');
    errEl.textContent = '';
    if(!email || !pass) return;
    const btn = document.getElementById('adminLoginBtn');
    btn.disabled = true; btn.textContent = 'Connexion...';
    try{
      const cred = await signInWithEmailAndPassword(fbAuth, email, pass);
      await checkAdminAndEnter(cred.user);
    }catch(err){
      errEl.textContent = 'Connexion refusée : identifiants incorrects.';
      btn.disabled = false; btn.textContent = 'Se connecter';
    }
  };
  document.getElementById('adminLoginBtn').onclick = go;
  document.getElementById('adminPass').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}

async function checkAdminAndEnter(user){
  try{
    const snap = await getDoc(doc(fbDB, 'admins', user.uid));
    if(snap.exists()){
      loadMsgTemplates(); renderAdminShell();
    } else {
      await signOut(fbAuth);
      app.innerHTML = `
        <div class="center-box">
          <div class="stamp ink"><div class="d">⛔</div></div>
          <h2>Accès refusé</h2>
          <p>Ce compte n'a pas les droits administrateur.</p>
          <div class="hero-actions" style="margin-top:14px"><button class="btn btn-ink" onclick="location.href=location.pathname">Retour au site</button></div>
        </div>`;
    }
  }catch(err){
    toast('❌ '+err.message);
  }
}

let inscSelected = new Set();
async function renderAdminInscriptions(){
  const body = document.getElementById('aBody');

  const decChipClass = d => d==='retenu' ? 'chip-done' : d==='non_retenu' ? 'chip-contact' : 'chip-new';
  const decLabel = d => d==='retenu' ? '✅ Retenu' : d==='non_retenu' ? '❌ Non retenu' : '⏳ En attente';
  const joursAttente = ts => Math.floor((Date.now()-ts)/86400000);
  const RAPPEL_SEUIL = 3; // jours avant alerte

  body.innerHTML = `
    <div class="a-card">
      <h3>✉️ Modèles de message (décision d'admission)</h3>

      <div style="margin-top:10px"><button class="btn btn-ink btn-sm" id="tplSave">💾 Enregistrer les modèles</button></div>
    </div>
    <div class="a-card" id="bulkBar" style="${inscSelected.size?'':'display:none'}">
      <h3>📤 Envoi groupé (${inscSelected.size} sélectionné${inscSelected.size>1?'s':''})</h3>

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" id="bulkWa">📲 Ouvrir tout en WhatsApp</button>
        <button class="btn btn-outline btn-sm" id="bulkEmail">✉️ Ouvrir tout en Email</button>
        <button class="btn btn-outline btn-sm" id="bulkSms">💬 Ouvrir tout en SMS</button>
        <button class="btn btn-outline btn-sm" id="bulkClear">Vider la sélection</button>
      </div>
    </div>
    <div class="a-card">

      <p class="t2" style="margin-bottom:10px">Génère un PDF avec nom, prénom, classe, filière et téléphone de tous les élèves marqués « Retenu ».</p>
      <button class="btn btn-red btn-sm" id="pdfRetenus">⬇️ Télécharger le PDF</button>
    </div>
    <div class="a-card"><h3>Fiches reçues (${list.length})</h3>
      ${list.length ? list.map(r=>{
        const jrs = joursAttente(r.dateInscription);
        const enAttenteDecision = !r.decision || r.decision==='en_attente';
        const alerte = enAttenteDecision && jrs>=RAPPEL_SEUIL;
        return `
        <div class="a-row" style="${alerte?'border-left:3px solid var(--red);padding-left:8px':''}">
          <input type="checkbox" data-select="${r.id}" ${inscSelected.has(r.id)?'checked':''} style="margin-top:4px">
          <div class="main">
            <div class="t1">${esc(r.nom)} ${esc(r.prenom)} <span class="chip ${chipClass(r.statut)}">${esc(r.statut||'nouveau')}</span> <span class="chip ${decChipClass(r.decision)}">${decLabel(r.decision)}</span></div>
            <div class="t2">${esc(r.classe)}${r.filiere?' · '+esc(r.filiere):''} · ${esc(r.telephone)}${r.email?' · '+esc(r.email):''} · ${new Date(r.dateInscription).toLocaleDateString('fr-FR')}</div>
            ${r.message ? `<div class="t2">💬 ${esc(r.message)}</div>` : ''}
            ${alerte ? `<div class="t2" style="color:var(--red)">⏰ En attente de décision depuis ${jrs} jour${jrs>1?'s':''}</div>` : ''}
          </div>
          <a class="btn btn-outline btn-sm" href="${waLink(r.telephone)}" target="_blank" rel="noopener">WhatsApp</a>
          <a class="btn ${r.bienvenueEnvoyee?'btn-outline':'btn-red'} btn-sm" href="${waWelcomeLink(r.telephone, r.prenom)}" target="_blank" rel="noopener" data-bienvenue="${r.id}">${r.bienvenueEnvoyee?'✅ Bienvenue envoyée':'🎉 Envoyer bienvenue'}</a>
          <select class="a-in" style="width:auto;margin-top:0" data-status="${r.id}">
            <option value="nouveau" ${r.statut==='nouveau'?'selected':''}>Nouveau</option>
            <option value="contacté" ${r.statut==='contacté'?'selected':''}>Contacté</option>
            <option value="inscrit" ${r.statut==='inscrit'?'selected':''}>Inscrit</option>
          </select>
          <button class="btn btn-outline btn-sm" data-del="${r.id}">Supprimer</button>
        </div>

          <select class="a-in" style="width:auto;margin-top:0" data-decision="${r.id}">

            <option value="retenu" ${r.decision==='retenu'?'selected':''}>✅ Retenu(e) pour le club</option>
            <option value="non_retenu" ${r.decision==='non_retenu'?'selected':''}>❌ Non retenu(e)</option>
          </select>
          <a class="btn btn-outline btn-sm" href="${decisionWaLink(r.telephone, r.prenom, r.decision==='non_retenu'?'non_retenu':'retenu')}" target="_blank" rel="noopener" data-decision-send="${r.id}" data-channel="wa">📲 Notifier WhatsApp</a>
          ${r.email ? `<a class="btn btn-outline btn-sm" href="${decisionMailLink(r.email, r.prenom, r.decision==='non_retenu'?'non_retenu':'retenu')}" data-decision-send="${r.id}" data-channel="email">✉️ Notifier Email</a>` : `<span class="t2" style="opacity:.6">✉️ Pas d'email fourni</span>`}
          <a class="btn btn-outline btn-sm" href="${decisionSmsLink(r.telephone, r.prenom, r.decision==='non_retenu'?'non_retenu':'retenu')}" data-decision-send="${r.id}" data-channel="sms">💬 Notifier SMS</a>
          ${r.decisionNotifiee ? `<span class="t2" style="color:var(--ok,#1a8f4c)">✅ Notification envoyée${r.decisionCanal?' ('+esc(r.decisionCanal)+')':''}</span>` : ''}

      <div class="main"><div class="t1">${esc(m.nom)}</div><div class="t2">${Number(m.prix||0).toLocaleString('fr-FR')} GNF${m.prof?' · '+esc(m.prof):''} · ${lecons.length} leçon(s)</div></div>

            <div class="a-row" style="flex-direction:column;align-items:stretch">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                <div class="main"><div class="t1">${iconOf(l.type)} ${esc(l.titre)}</div>
                  <div class="t2">${l.type==='quiz'?(l.questions||[]).length+' question(s)':''}${l.date?fmtFull(l.date):''}${l.dateLimite?'À rendre avant le '+fmtFull(l.dateLimite):''}${l.url?' · '+esc(l.url):''}</div></div>
                <div style="display:flex;gap:6px">
                  ${l.type==='quiz' ? `<button class="btn btn-outline btn-sm" data-quiztoggle="${m.id}|${l.id}">${openQuizAdmin===(m.id+'|'+l.id)?'Fermer':'Gérer les questions'}</button><button class="btn btn-outline btn-sm" data-quizresults="${m.id}|${l.id}">Voir les résultats</button>` : ''}

function wireAdminMatieres(list){
  const body = document.getElementById('aBody');
  body.querySelectorAll('[data-toggle]').forEach(b=>{
    b.onclick = ()=>{
      openMatiereAdmin = openMatiereAdmin===b.dataset.toggle ? null : b.dataset.toggle;
      leconFormType = 'video'; leconQuizDraft = [];
      renderAdminMatieresBody();
    };
  });
  body.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = async ()=>{ if(!confirm('Supprimer cette matière et toutes ses leçons ?')) return;
      await deleteDoc(doc(fbDB, C_MATIERES, b.dataset.del)); toast('🗑️ Matière supprimée'); renderAdminMatieres(); };
  });
  const typeSelect = body.querySelector('#leconTypeSelect');
  if(typeSelect){
    typeSelect.onchange = ()=>{ leconFormType = typeSelect.value; leconQuizDraft = []; renderAdminMatieresBody(); };
  }
  const quizDraftForm = body.querySelector('#quizDraftForm');
  if(quizDraftForm){
    quizDraftForm.addEventListener('submit', ev=>{
      ev.preventDefault();
      const fd = new FormData(quizDraftForm);
      const options = [fd.get('opt0'),fd.get('opt1'),fd.get('opt2'),fd.get('opt3')].map(o=>(o||'').trim()).filter(Boolean);
      const texte = (fd.get('texte')||'').trim();
      if(!texte || options.length<2){ toast('⚠️ Renseignez la question et au moins 2 options'); return; }
      leconQuizDraft.push({ texte, options, correct: parseInt(fd.get('correct'),10)||0 });
      renderAdminMatieresBody();
    });
  }
  body.querySelectorAll('[data-delquizdraft]').forEach(b=>{
    b.onclick = ()=>{ leconQuizDraft.splice(parseInt(b.dataset.delquizdraft,10),1); renderAdminMatieresBody(); };
  });
  const submitQuizBtn = body.querySelector('#submitQuizBtn');
  if(submitQuizBtn){
    submitQuizBtn.onclick = async ()=>{
      const matiereId = submitQuizBtn.dataset.matiere;
      const m = list.find(x=>x.id===matiereId);
      const titreEl = body.querySelector('#quizTitreInput');
      const titre = (titreEl.value||'').trim();
      if(!titre){ toast('⚠️ Merci de donner un titre au QCM'); titreEl.focus(); return; }
      if(!leconQuizDraft.length){ toast('⚠️ Ajoutez au moins une question'); return; }
      const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(36).slice(2));
      const lecon = { id, type:'quiz', titre, url:'', date:null, consignes:'', dateLimite:null,
        questions: leconQuizDraft, ordre: (m.lecons||[]).length };
      submitQuizBtn.disabled = true; submitQuizBtn.textContent = 'Création...';
      try{
        await updateDoc(doc(fbDB, C_MATIERES, matiereId), { lecons: [...(m.lecons||[]), lecon] });
        toast('✅ QCM créé'); openMatiereAdmin = matiereId; leconFormType = 'video'; leconQuizDraft = [];
        renderAdminMatieres();
      }catch(err){ toast('❌ '+err.message); submitQuizBtn.disabled = false; submitQuizBtn.textContent = 'Créer le QCM'; }
    };
  }
  body.querySelectorAll('[data-leconform]').forEach(f=>{
    f.addEventListener('submit', async ev=>{
      ev.preventDefault();
      const matiereId = f.dataset.leconform;
      const m = list.find(x=>x.id===matiereId);
      const fd = new FormData(f);
      const type = leconFormType;
      const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(36).slice(2));
      const lecon = { id, type, titre: fd.get('titre').trim(), url: (fd.get('url')||'').trim(),
        date: fd.get('date') ? new Date(fd.get('date')).getTime() : null,
        consignes: (fd.get('consignes')||'').trim(),
        dateLimite: fd.get('dateLimite') ? new Date(fd.get('dateLimite')).getTime() : null,
        ordre: (m.lecons||[]).length };
      try{
        await updateDoc(doc(fbDB, C_MATIERES, matiereId), { lecons: [...(m.lecons||[]), lecon] });
        toast('✅ Leçon ajoutée'); openMatiereAdmin = matiereId; leconFormType = 'video';
        renderAdminMatieres();
      }catch(err){ toast('❌ '+err.message); }
    });
  });
  body.querySelectorAll('[data-quiztoggle]').forEach(b=>{
    b.onclick = ()=>{ openQuizAdmin = openQuizAdmin===b.dataset.quiztoggle ? null : b.dataset.quiztoggle; renderAdminMatieres(); };
  });
  body.querySelectorAll('[data-corriger]').forEach(b=>{
    b.onclick = ()=>{ const [matiereId, leconId] = b.dataset.corriger.split('|'); renderAdminCorrection(matiereId, leconId); };
  });
  body.querySelectorAll('[data-quizresults]').forEach(b=>{
    b.onclick = ()=>{ const [matiereId, leconId] = b.dataset.quizresults.split('|'); renderAdminQuizResults(matiereId, leconId); };
  });
  body.querySelectorAll('[data-questionform]').forEach(f=>{
    f.addEventListener('submit', async ev=>{
      ev.preventDefault();
      const [matiereId, leconId] = f.dataset.questionform.split('|');
      const m = list.find(x=>x.id===matiereId);
      const fd = new FormData(f);
      const options = [fd.get('opt0'),fd.get('opt1'),fd.get('opt2'),fd.get('opt3')].map(o=>(o||'').trim()).filter(Boolean);
      const question = { texte: fd.get('texte').trim(), options, correct: parseInt(fd.get('correct'),10) };
      const newLecons = (m.lecons||[]).map(l=> l.id===leconId ? {...l, questions:[...(l.questions||[]), question]} : l);
      try{
        await updateDoc(doc(fbDB, C_MATIERES, matiereId), { lecons: newLecons });
        toast('✅ Question ajoutée'); renderAdminMatieres();
      }catch(err){ toast('❌ '+err.message); }
    });
  });
  body.querySelectorAll('[data-delquestion]').forEach(b=>{
    b.onclick = async ()=>{
      const [matiereId, leconId] = b.dataset.delquestion.split('|');
      const qi = parseInt(b.dataset.qindex,10);
      const m = list.find(x=>x.id===matiereId);
      const newLecons = (m.lecons||[]).map(l=> l.id===leconId ? {...l, questions:(l.questions||[]).filter((_,i)=>i!==qi)} : l);
      try{
        await updateDoc(doc(fbDB, C_MATIERES, matiereId), { lecons: newLecons });
        toast('🗑️ Question supprimée'); renderAdminMatieres();
      }catch(err){ toast('❌ '+err.message); }
    };
  });
  body.querySelectorAll('[data-dellecon]').forEach(b=>{
    b.onclick = async ()=>{
      const matiereId = b.dataset.dellecon, idx = parseInt(b.dataset.index,10);
      const m = list.find(x=>x.id===matiereId);
      const newLecons = (m.lecons||[]).filter((_,i)=>i!==idx);
      try{
        await updateDoc(doc(fbDB, C_MATIERES, matiereId), { lecons: newLecons });
        toast('🗑️ Leçon supprimée'); openMatiereAdmin = matiereId; renderAdminMatieres();
      }catch(err){ toast('❌ '+err.message); }
    };
  });
}

function tplAdminEleveRow(e, paiements, quiz, devoirs){
  const nbActifs = paiements.filter(p=>p.uid===e.uid && p.statut==='valide').length;
  const nbQuiz = quiz.filter(r=>r.uid===e.uid).length;
  const nbDevoirs = devoirs.filter(d=>d.uid===e.uid).length;
  return `
    <div class="a-row">
      <div class="main">
        <div class="t1">${esc(e.prenom||'')} ${esc(e.nom||'')}</div>
        <div class="t2">${esc(e.telephone||'—')} · ${esc(e.email||'')}${e.createdAt?' · Inscrit le '+new Date(e.createdAt).toLocaleDateString('fr-FR'):''}</div>
        <div class="t2">${nbActifs} matière(s) active(s) · ${nbQuiz} QCM · ${nbDevoirs} devoir(s)</div>
      </div>
    </div>`;
}

/* ── Admin : validation des paiements Mobile Money ── */
async function renderAdminPaiements(){
  const body = document.getElementById('aBody');
  const snap = await getDocs(query(collection(fbDB, C_PAIEMENTS), orderBy('createdAt','desc')));
  const list = snap.docs.map(d=>({id:d.id,...d.data()}));
  const enAttente = list.filter(p=>p.statut==='attente');
  const traites = list.filter(p=>p.statut!=='attente');
  body.innerHTML = `
    <div class="a-card"><h3>⏳ En attente de validation (${enAttente.length})</h3>
      ${enAttente.length ? enAttente.map(p=>tplAdminPaiementRow(p,true)).join('') : '<div class="empty-note">Aucun paiement en attente.</div>'}
    </div>
    <div class="a-card"><h3>Historique (${traites.length})</h3>
      ${traites.length ? traites.map(p=>tplAdminPaiementRow(p,false)).join('') : '<div class="empty-note">Aucun paiement traité.</div>'}
    </div>`;
  body.querySelectorAll('[data-valider]').forEach(b=>{
    b.onclick = async ()=>{
      await updateDoc(doc(fbDB, C_PAIEMENTS, b.dataset.valider), { statut: 'valide', validatedAt: Date.now() });
      toast("✅ Accès activé pour l'élève"); renderAdminPaiements();
    };
  });
  body.querySelectorAll('[data-refuser]').forEach(b=>{
    b.onclick = async ()=>{ if(!confirm('Refuser ce paiement ?')) return;
      await updateDoc(doc(fbDB, C_PAIEMENTS, b.dataset.refuser), { statut: 'refuse', validatedAt: Date.now() });
      toast('❌ Paiement refusé'); renderAdminPaiements();
    };
  });
}

function tplAdminPaiementRow(p, showActions){
  const badge = p.statut==='valide' ? '<span class="course-badge valide">✅ Validé</span>'
    : p.statut==='refuse' ? '<span class="course-badge refuse">❌ Refusé</span>'
    : '<span class="course-badge attente">⏳ En attente</span>';
  return `
    <div class="a-row">
      <div class="main">
        <div class="t1">${esc(p.eleveNom||p.eleveEmail)} — ${esc(p.matiereNom)}</div>
        <div class="t2">${Number(p.montant||0).toLocaleString('fr-FR')} GNF · Tél : ${esc(p.telephone)} · Réf : ${esc(p.reference)} · ${new Date(p.createdAt).toLocaleDateString('fr-FR')}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${badge}
        ${showActions ? `<button class="btn btn-ink btn-sm" data-valider="${p.id}">Valider</button><button class="btn btn-outline btn-sm" data-refuser="${p.id}">Refuser</button>` : ''}
      </div>
    </div>`;
}

/* ── Admin : résultats d'un QCM ── */
async function renderAdminQuizResults(matiereId, leconId){
  const body = document.getElementById('aBody');
  body.innerHTML = '<div class="spinner"></div>';
  const msnap = await getDoc(doc(fbDB, C_MATIERES, matiereId));
  const m = msnap.exists() ? {id:msnap.id,...msnap.data()} : null;
  const lecon = m ? (m.lecons||[]).find(l=>l.id===leconId) : null;
  const snap = await getDocs(query(collection(fbDB, C_QUIZ_RES), where('leconId','==',leconId)));
  const list = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const moyenne = list.length ? (list.reduce((s,r)=>s+(r.score/r.total),0)/list.length*20).toFixed(1) : '—';
  body.innerHTML = `
    <div class="a-card">
      <button class="btn btn-outline btn-sm" id="backToMatieres">← Retour aux matières</button>
      <h3 style="margin-top:10px">📝 Résultats — ${esc(lecon?lecon.titre:'')} (${esc(m?m.nom:'')})</h3>
      <p class="t2">Moyenne de la classe : <b>${moyenne}${moyenne!=='—'?'/20':''}</b> · ${list.length} tentative(s)</p>
      ${list.length ? list.map(r=>`
        <div class="a-row"><div class="main"><div class="t1">${esc(r.eleveNom)}</div>
          <div class="t2">${new Date(r.createdAt).toLocaleDateString('fr-FR')}</div></div>
          <div class="t1">${r.score}/${r.total}</div>
        </div>`).join('') : '<div class="empty-note">Personne n\\u2019a encore passé ce QCM.</div>'}
    </div>`;
  document.getElementById('backToMatieres').onclick = ()=>{ adminTab='matieres'; paintATabs(); renderAdminTab(); };
}

/* ── Admin : correction des devoirs ── */
async function renderAdminCorrection(matiereId, leconId){
  const body = document.getElementById('aBody');
  body.innerHTML = '<div class="spinner"></div>';
  const msnap = await getDoc(doc(fbDB, C_MATIERES, matiereId));
  const m = msnap.exists() ? {id:msnap.id,...msnap.data()} : null;
  const lecon = m ? (m.lecons||[]).find(l=>l.id===leconId) : null;
  const snap = await getDocs(query(collection(fbDB, C_DEVOIRS), where('leconId','==',leconId)));
  const list = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  body.innerHTML = `
    <div class="a-card">
      <button class="btn btn-outline btn-sm" id="backToMatieres">← Retour aux matières</button>
      <h3 style="margin-top:10px">📚 Copies — ${esc(lecon?lecon.titre:'')} (${esc(m?m.nom:'')})</h3>
      ${list.length ? list.map(s=>`
        <div class="a-row" style="flex-direction:column;align-items:stretch">
          <div class="main"><div class="t1">${esc(s.eleveNom||s.eleveEmail)}</div>
            <div class="t2">${new Date(s.createdAt).toLocaleDateString('fr-FR')} — ${esc(s.contenu)}</div></div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
            <input class="a-in" style="width:90px;margin-top:0" type="number" min="0" max="20" placeholder="/20" data-note="${s.id}" value="${s.note??''}">
            <input class="a-in" style="flex:1;min-width:180px;margin-top:0" placeholder="Commentaire (optionnel)" data-comment="${s.id}" value="${esc(s.commentaire||'')}">
            <button class="btn btn-ink btn-sm" data-grade="${s.id}">${s.statut==='corrige'?'Mettre à jour':'Noter'}</button>
          </div>
          ${s.statut==='corrige'?'<div class="course-badge valide" style="margin-top:6px">✅ Corrigé</div>':'<div class="course-badge attente" style="margin-top:6px">⏳ Non corrigé</div>'}
        </div>`).join('') : '<div class="empty-note">Aucune copie rendue pour le moment.</div>'}
    </div>`;
  document.getElementById('backToMatieres').onclick = ()=>{ adminTab='matieres'; paintATabs(); renderAdminTab(); };
  body.querySelectorAll('[data-grade]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.grade;
      const note = parseFloat(body.querySelector(`[data-note="${id}"]`).value);
      const commentaire = body.querySelector(`[data-comment="${id}"]`).value.trim();
      if(isNaN(note)){ toast('⚠️ Merci d\\u2019indiquer une note'); return; }
      try{
        await updateDoc(doc(fbDB, C_DEVOIRS, id), { note, commentaire, statut:'corrige', corrigeAt: Date.now() });
        toast('✅ Copie notée'); renderAdminCorrection(matiereId, leconId);
      }catch(err){ toast('❌ '+err.message); }
    };
  });
}

if (params.get('admin') === '1') {
