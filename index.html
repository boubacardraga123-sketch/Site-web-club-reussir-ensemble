<style>
:root{
  --ink:#0F2F63; --ink2:#3E63A8;
  --paper:#FBFCFF; --paper2:#E8F1FC;
  --red:#FF5A3C; --gold:#2E7FE3;
  --line: rgba(15,47,99,.15);
  --line-soft: rgba(15,47,99,.07);
  --font-title: 'Fraunces', serif;
  --font-body: 'Work Sans', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --radius: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}

/* ── BANDEAU DÉFILANT — citations de motivation ── */
.marquee{
  background:linear-gradient(90deg, var(--red), #FF8A5C);
  overflow:hidden; white-space:nowrap;
  padding:9px 0;
}
.marquee-track{
  display:inline-block;
  animation: marquee-scroll 38s linear infinite;
  will-change: transform;
}
.marquee-track span{
  display:inline-block;
  font-family:var(--font-mono); font-size:11.5px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:#fff;
  padding:0 28px;
}
.marquee-track span::after{ content:'✦'; margin-left:28px; opacity:.7; }
@keyframes marquee-scroll{
  from{ transform:translateX(0); }
  to{ transform:translateX(-50%); }
}
@media (prefers-reduced-motion: reduce){
  .marquee-track{ animation:none; }
  .marquee{ overflow-x:auto; }
}
body{
  background:var(--paper2);
  font-family:var(--font-body);color:var(--ink);min-height:100vh;
}
h1,h2,h3{font-family:var(--font-title);color:var(--ink);line-height:1.08}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
a{color:inherit}

/* ── TOPBAR ── */
.topbar{background:var(--ink);color:var(--paper);padding:14px 0}
.topbar .row{display:flex;align-items:center;gap:12px}
.brand-seal{width:44px;height:44px;border-radius:50%;border:2px dashed var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--gold);flex-shrink:0}
.brand-txt{flex:1;min-width:0}
.brand-txt .n{font-family:var(--font-title);font-weight:700;font-size:16px}
.brand-txt .m{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9aa4c7;margin-top:1px}
.admin-link{font-family:var(--font-mono);font-size:10px;color:#7c86ab;text-decoration:none;border:1px solid #3b4568;border-radius:calc(var(--radius) - 2px);padding:5px 9px;white-space:nowrap}

/* ── BINDER TABS ── */
.site-nav{display:flex;gap:5px;overflow-x:auto;padding-top:14px}
.site-nav button{background:var(--paper2);border:1.5px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;padding:10px 15px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);cursor:pointer;white-space:nowrap;transform:translateY(3px);transition:transform .15s,background .15s,color .15s}
.site-nav button.active{background:var(--paper);color:var(--ink);transform:translateY(0);box-shadow:0 -2px 6px rgba(22,33,62,.08)}
.site-body{background:var(--paper);border-top:1.5px solid var(--line);min-height:60vh;padding:28px 0 60px}
.rule-lines{background-image:repeating-linear-gradient(180deg, transparent, transparent 27px, var(--line-soft) 28px)}

/* ── STAMP ── */
.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;border:2px dashed currentColor;transform:rotate(-7deg);font-family:var(--font-mono);line-height:1;flex-shrink:0}
.stamp .d{font-size:19px;font-weight:700}
.stamp .m{font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.stamp.gold{color:var(--gold)} .stamp.red{color:var(--red)} .stamp.ink{color:var(--ink2)}

/* ── HERO ── */
.hero{padding:34px 0 26px;text-align:center}
.hero .motto-stamp{display:inline-block;border:2px dashed var(--red);color:var(--red);font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:6px 16px;border-radius:30px;transform:rotate(-2deg);margin-bottom:16px}
.hero h1{font-size:clamp(28px,6vw,46px);font-style:italic;font-weight:700;max-width:620px;margin:0 auto}
.hero p.lead{max-width:520px;margin:14px auto 0;color:var(--ink2);font-size:14.5px;line-height:1.6}
.hero-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}

/* ── BUTTONS ── */
.btn{padding:11px 18px;border-radius:var(--radius);border:none;font-weight:700;cursor:pointer;font-family:var(--font-body);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-red{background:var(--red);color:#fff}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:calc(var(--radius) - 1px)}
.btn:active{opacity:.82}

/* ── VISION & VALEURS ── */
.apropos-block{display:flex;gap:24px;flex-wrap:wrap;margin:30px 0 36px;padding:20px 0;border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line)}
.apropos-col{flex:1;min-width:220px}
.apropos-txt{font-size:14px;color:var(--ink2);line-height:1.65}

/* ── SECTION HEAD ── */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{font-size:22px}
.sec-head .eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}

/* ── EVENT CARDS ── */
.evt-list{display:flex;flex-direction:column;gap:12px}
.evt-card{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:calc(var(--radius) - 2px);padding:14px;box-shadow:0 2px 8px rgba(22,33,62,.06)}
.evt-card .txt{flex:1;min-width:0}
.evt-card .txt h3{font-size:16px;font-weight:700;margin-bottom:4px}
.evt-card .txt .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink2);margin-bottom:6px}
.evt-card .txt p{font-size:13px;color:var(--ink2);line-height:1.5}
.evt-card .txt .lnk{margin-top:8px}
.empty-note{text-align:center;color:var(--ink2);font-size:13.5px;padding:30px 10px;border:1.5px dashed var(--line);border-radius:var(--radius)}

/* ── GALLERY ── */
.gallery-grid{column-count:2;column-gap:14px}
@media(min-width:640px){.gallery-grid{column-count:3}}
.gallery-item{position:relative;break-inside:avoid;margin-bottom:16px;background:#fff;padding:7px 7px 12px;box-shadow:0 4px 12px rgba(22,33,62,.14);cursor:pointer}
.gallery-item img{width:100%;display:block;background:var(--paper2)}
.gallery-item .cap{font-size:11px;color:var(--ink2);margin-top:6px;padding:0 2px;font-family:var(--font-mono)}
.gallery-item::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-3deg);width:54px;height:20px;background:rgba(182,144,31,.32);border:1px solid rgba(182,144,31,.5)}
.lightbox{position:fixed;inset:0;background:rgba(22,33,62,.92);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px}
.lightbox img{max-width:92vw;max-height:78vh;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.lightbox .cap{color:var(--paper);font-family:var(--font-mono);font-size:12px}
.lightbox .close{position:absolute;top:16px;right:16px;background:none;border:1.5px solid var(--paper);color:var(--paper);border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer}

/* ── AVIS VISITEURS (fenêtre + bouton flottant) ── */
.avis-fab{position:fixed;right:18px;bottom:18px;z-index:900;background:var(--red);color:#fff;border:none;border-radius:30px;padding:13px 18px;font-family:var(--font-body);font-weight:700;font-size:13px;box-shadow:0 6px 18px rgba(255,90,60,.4);cursor:pointer;display:flex;align-items:center;gap:8px}
.avis-overlay{position:fixed;inset:0;background:rgba(15,47,99,.55);z-index:998;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.avis-overlay{align-items:center}}
.avis-panel{background:var(--paper);width:100%;max-width:480px;max-height:82vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:640px){.avis-panel{border-radius:16px;max-height:74vh}}
.avis-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.avis-head h3{font-size:16px}
.avis-head .close{background:none;border:none;font-size:18px;color:var(--ink2);cursor:pointer;padding:4px 8px}
.avis-list{overflow-y:auto;padding:14px 18px;flex:1}
.avis-item{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.avis-item .nom{font-weight:700;font-size:13px}
.avis-item .txt{font-size:13.5px;color:var(--ink2);margin-top:2px}
.avis-item .reponse{margin-top:8px;background:var(--paper2);border-radius:var(--radius);padding:8px 10px;font-size:12.5px}
.avis-item .reponse b{color:var(--gold)}
.avis-form{padding:14px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.avis-form input,.avis-form textarea{border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;font-family:inherit;font-size:13.5px}
.avis-form textarea{resize:vertical;min-height:60px}

/* ── VIDEOS ── */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.video-card{background:#fff;border:1px solid var(--line);border-radius:calc(var(--radius) - 2px);overflow:hidden;box-shadow:0 2px 8px rgba(22,33,62,.06)}
.video-card .frame{position:relative;aspect-ratio:16/9;background:#000}
.video-card .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-card .info{padding:10px 12px}
.video-card .info h3{font-size:13.5px;font-weight:700}
.video-card .info p{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.4}

/* ── FICHE FORM ── */
.fiche{background:#fff;border:3px double var(--ink);border-radius:4px;padding:22px 20px;max-width:520px;margin:0 auto;position:relative}
.fiche .fiche-head{text-align:center;margin-bottom:18px}
.fiche .fiche-head .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.fiche .fiche-head h2{font-size:20px;margin-top:4px}
label.f-label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:4px;margin-top:14px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em}
.fiche input,.fiche select,.fiche textarea{width:100%;padding:10px 11px;border:none;border-bottom:1.5px solid var(--line);background:transparent;font-size:14px;font-family:var(--font-body);outline:none;border-radius:0}
.fiche input:focus,.fiche select:focus,.fiche textarea:focus{border-bottom-color:var(--red)}
.fiche textarea{resize:vertical;min-height:60px}
.confirm-box{text-align:center;padding:20px 10px}
.confirm-box .stamp{width:96px;height:96px;margin:0 auto 14px}
.confirm-box .stamp .d{font-size:24px}

/* ── FOOTER ── */
.site-footer{background:var(--ink);color:#9aa4c7;padding:22px 0;text-align:center;font-size:12px}
.site-footer strong{color:var(--paper)}

/* ── ADMIN ── */
.admin-shell{background:var(--paper2);min-height:100vh;padding-bottom:40px}
.admin-top{background:var(--ink);color:var(--paper);padding:14px 0}
.admin-top .row{display:flex;align-items:center;gap:10px}
.admin-top h1{color:var(--paper);font-size:16px;flex:1}
.admin-tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}
.admin-tabs button{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:8px 13px;font-weight:700;font-size:12px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.admin-tabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.a-card{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.a-card h3{font-size:14.5px;margin-bottom:12px}
.a-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.a-row:last-child{border-bottom:none}
.a-row .main{flex:1;min-width:160px}
.a-row .main .t1{font-weight:700;font-size:13px}
.a-row .main .t2{font-size:11.5px;color:var(--ink2);margin-top:1px}
.chip{font-size:10px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap;font-family:var(--font-mono)}
.chip-new{background:#fdecea;color:var(--red)}
.chip-contact{background:#fdf3e0;color:var(--gold)}
.chip-done{background:#e6f4ea;color:#1e7e34}
input.a-in,select.a-in,textarea.a-in{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:var(--radius);font-size:13px;font-family:var(--font-body);outline:none;margin-top:4px}
input.a-in:focus,select.a-in:focus,textarea.a-in:focus{border-color:var(--ink)}
label.a-label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:10px}

/* ── LOGIN / MISC ── */
.center-box{max-width:380px;margin:70px auto;text-align:center;padding:0 16px}
.center-box .stamp{width:80px;height:80px;margin:0 auto 16px}
.center-box p{color:var(--ink2);font-size:13.5px;margin-top:8px;line-height:1.5}
.center-box input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--radius);font-size:14px;margin-top:16px;text-align:center;font-family:var(--font-mono);letter-spacing:.1em}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
/* ── MOBILE (téléphone) ── */
@media(max-width:480px){
  .wrap{padding:0 12px}
  .topbar{padding:12px 0}
  .topbar .row{flex-wrap:wrap}
  .brand-txt .n{font-size:14.5px}
  .site-nav button{padding:9px 12px;font-size:10.5px}
  .hero{padding:26px 0 18px}
  .hero .lead{font-size:14px}
  .hero-actions{flex-direction:column;align-items:stretch}
  .hero-actions .btn{width:100%;justify-content:center}
  .evt-card{flex-direction:column;align-items:flex-start;padding:13px}
  .evt-card .stamp{margin-bottom:8px}
  .video-grid{grid-template-columns:1fr}
  .fiche{padding:18px 15px}
  .sec-head h2{font-size:19px}
}
@media(max-width:380px){
  .gallery-grid{column-count:1}
}
</style>

function generatePdfRetenus(retenus){
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF){ toast("❌ Le générateur PDF n'a pas pu se charger — vérifiez la connexion internet"); return; }
  const docPdf = new jsPDF();
  const dateStr = new Date().toLocaleDateString('fr-FR', {day:'2-digit',month:'long',year:'numeric'});

  docPdf.setFontSize(16);
  docPdf.setFont(undefined,'bold');
  docPdf.text('Club Réussir Ensemble', 14, 18);
  docPdf.setFontSize(11);
  docPdf.setFont(undefined,'normal');
  docPdf.text('Rigueur · Discipline · Travail', 14, 25);
  docPdf.setFontSize(13);
  docPdf.setFont(undefined,'bold');
  docPdf.text('Liste des élèves retenus', 14, 35);
  docPdf.setFontSize(10);
  docPdf.setFont(undefined,'normal');
  docPdf.text(`Établie le ${dateStr} — ${retenus.length} élève${retenus.length>1?'s':''} retenu${retenus.length>1?'s':''}`, 14, 41);

  const rows = retenus
    .slice()
    .sort((a,b)=> (a.nom||'').localeCompare(b.nom||''))
    .map((r,i)=> [i+1, esc0(r.nom), esc0(r.prenom), esc0(r.classe), esc0(r.filiere)||'—', esc0(r.telephone)]);

  docPdf.autoTable({
    startY: 47,
    head: [['#','Nom','Prénom','Classe','Filière','Téléphone']],
    body: rows,
    styles: { fontSize: 10, cellPadding: 3 },
    headStyles: { fillColor: [255,90,60] },
    theme: 'grid'
  });

  const finalY = (docPdf.lastAutoTable && docPdf.lastAutoTable.finalY) || 47;
  docPdf.setFontSize(9);
  docPdf.setTextColor(120);
  docPdf.text('Document généré automatiquement depuis le site du Club Réussir Ensemble.', 14, finalY + 12);

  docPdf.save(`Club_Reussir_Ensemble_Retenus_${new Date().toISOString().slice(0,10)}.pdf`);
}

const DEFAULT_THEME = { ink:'#0F2F63', ink2:'#3E63A8', paper:'#FBFCFF', paper2:'#E8F1FC', red:'#FF5A3C', gold:'#2E7FE3', fontTitle:'Fraunces', fontBody:'Work Sans', radius:'8' };

const FONT_TITLE_OPTIONS = {
  'Fraunces':'Fraunces, serif',
  'Playfair Display':"'Playfair Display', serif",
  'DM Serif Display':"'DM Serif Display', serif",
  'Libre Baskerville':"'Libre Baskerville', serif",
  'Cormorant Garamond':"'Cormorant Garamond', serif",
  'Poppins':'Poppins, sans-serif',
  'Sora':'Sora, sans-serif'
};
const FONT_BODY_OPTIONS = {
  'Work Sans':"'Work Sans', sans-serif",
  'Inter':'Inter, sans-serif',
  'Lato':'Lato, sans-serif',
  'Nunito Sans':"'Nunito Sans', sans-serif",
  'Source Sans 3':"'Source Sans 3', sans-serif",
  'Karla':'Karla, sans-serif'
};
const GOOGLE_FONT_URL_NAME = {
  'Fraunces':'Fraunces:ital,wght@0,600;0,700;0,900;1,600',
  'Playfair Display':'Playfair+Display:wght@600;700;900',
  'DM Serif Display':'DM+Serif+Display:ital@0;1',
  'Libre Baskerville':'Libre+Baskerville:wght@400;700',
  'Cormorant Garamond':'Cormorant+Garamond:wght@600;700',
  'Poppins':'Poppins:wght@600;700;900',
  'Sora':'Sora:wght@600;700;800',
  'Work Sans':'Work+Sans:wght@400;500;600;700',
  'Inter':'Inter:wght@400;500;600;700',
  'Lato':'Lato:wght@400;700;900',
  'Nunito Sans':'Nunito+Sans:wght@400;600;700',
  'Source Sans 3':'Source+Sans+3:wght@400;600;700',
  'Karla':'Karla:wght@400;500;600;700'
};

function loadGoogleFont(name){
  if(!name || GOOGLE_FONT_URL_NAME[name]===undefined) return;
  const id = 'gf-'+name.replace(/[^a-z0-9]/gi,'-');
  if(document.getElementById(id)) return; // déjà chargée
  const link = document.createElement('link');
  link.id = id; link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${GOOGLE_FONT_URL_NAME[name]}&display=swap`;
  document.head.appendChild(link);
}

function applyTheme(theme){
  const t = { ...DEFAULT_THEME, ...(theme||{}) };
  const root = document.documentElement.style;
  root.setProperty('--ink', t.ink);
  root.setProperty('--ink2', t.ink2);
  root.setProperty('--paper', t.paper);
  root.setProperty('--paper2', t.paper2);
  root.setProperty('--red', t.red);
  root.setProperty('--gold', t.gold);
  loadGoogleFont(t.fontTitle);
  loadGoogleFont(t.fontBody);
  root.setProperty('--font-title', FONT_TITLE_OPTIONS[t.fontTitle] || `'${t.fontTitle}', serif`);
  root.setProperty('--font-body', FONT_BODY_OPTIONS[t.fontBody] || `'${t.fontBody}', sans-serif`);
  root.setProperty('--radius', (t.radius ?? '8') + 'px');
}

let sealClicks = 0, sealClickTimer, sealLastTap = 0;
function wireAdminTrigger(){
  const seal = document.querySelector('.topbar .brand-seal');
  if(!seal) return;
  seal.style.cursor = 'pointer';
  seal.style.touchAction = 'manipulation'; // évite le double-tap zoom
  seal.style.position = 'relative';
  // zone de tap invisible plus grande que le rond visible, plus facile à toucher
  const hit = document.createElement('div');
  hit.style.cssText = 'position:absolute;inset:-14px;';
  seal.appendChild(hit);

  const trigger = (e)=>{
    if(e) e.preventDefault();
    const now = Date.now();
    if(now - sealLastTap > 3000){ sealClicks = 0; }
    sealLastTap = now;
    sealClicks++;
    clearTimeout(sealClickTimer);
    sealClickTimer = setTimeout(()=>{ sealClicks = 0; }, 3000);
    toast(`🔒 ${sealClicks}/5`);
    if(sealClicks >= 5){
      sealClicks = 0;
      location.href = location.pathname + '?admin=1';
    }
  };

  // pointerup couvre tactile + souris en un seul événement, plus fiable que touchend/click séparés
  hit.addEventListener('pointerup', trigger);
  seal.addEventListener('pointerup', trigger);
}

function listenAll(){
  unsubs.push(onSnapshot(doc(fbDB, C_CONFIG, 'theme'), snap=>{

    siteConfig = snap.exists() ? snap.data() : {};
    if(siteTab==='accueil') renderSiteTab();
  }));
  unsubs.push(onSnapshot(doc(fbDB, C_CONFIG, 'stats'), snap=>{
    siteStats = snap.exists() ? snap.data() : {};
    if(siteTab==='accueil') renderSiteTab();
  }));
  unsubs.push(onSnapshot(query(collection(fbDB, C_EVT), orderBy('date','desc')), snap=>{
    events = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(siteTab==='accueil'||siteTab==='evenements') renderSiteTab();
  }));
  unsubs.push(onSnapshot(query(collection(fbDB, C_GAL), orderBy('createdAt','desc')), snap=>{
    gallery = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(siteTab==='accueil'||siteTab==='galerie') renderSiteTab();
  }));
  unsubs.push(onSnapshot(query(collection(fbDB, C_VID), orderBy('createdAt','desc')), snap=>{
    videos = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(siteTab==='accueil'||siteTab==='videos') renderSiteTab();
  }));
  unsubs.push(onSnapshot(query(collection(fbDB, C_TEMOIN), orderBy('createdAt','desc')), snap=>{
    temoignages = snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.visible!==false);
    if(siteTab==='accueil'||siteTab==='temoignages') renderSiteTab();

  unsubs.push(onSnapshot(query(collection(fbDB, C_SESS), orderBy('dateDebut','asc')), snap=>{
    sessions = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(siteTab==='accueil'||siteTab==='sessions'||siteTab==='inscription') renderSiteTab();
  }));
}

function wireSiteBody(){

function openLightbox(url, cap){
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<button class="close">✕</button><img src="${esc(url)}">${cap?`<div class="cap">${esc(cap)}</div>`:''}`;
  lb.onclick = e=>{ if(e.target===lb || e.target.classList.contains('close')) lb.remove(); };
  document.body.appendChild(lb);
}

let avisUnsub = null;
function openAvisPanel(){
  const overlay = document.createElement('div');
  overlay.className = 'avis-overlay';
  overlay.innerHTML = `
    <div class="avis-panel">
      <div class="avis-head"><h3>💬 Exprimez-vous</h3><button class="close">✕</button></div>
      <div class="avis-list" id="avisList"><div class="spinner"></div></div>
      <form class="avis-form" id="avisForm">
        <input type="text" name="nom" placeholder="Votre nom (optionnel)" maxlength="60">
        <textarea name="texte" placeholder="Votre avis, question ou message..." required maxlength="500"></textarea>
        <button type="submit" class="btn btn-red" style="justify-content:center">Envoyer</button>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  const closeIt = ()=>{ if(avisUnsub){ avisUnsub(); avisUnsub=null; } overlay.remove(); };
  overlay.onclick = e=>{ if(e.target===overlay) closeIt(); };
  overlay.querySelector('.close').onclick = closeIt;

  const list = overlay.querySelector('#avisList');
  avisUnsub = onSnapshot(query(collection(fbDB, C_AVIS), orderBy('createdAt','desc')), snap=>{
    const items = snap.docs.map(d=>({id:d.id,...d.data()}));
    list.innerHTML = items.length ? items.map(a=>`
      <div class="avis-item">
        <div class="nom">${esc(a.nom||'Anonyme')}</div>
        <div class="txt">${esc(a.texte)}</div>
        ${a.reponse ? `<div class="reponse"><b>Réponse du club :</b> ${esc(a.reponse)}</div>` : ''}
      </div>`).join('') : '<div class="empty-note">Soyez le premier à laisser un message !</div>';
  });

  overlay.querySelector('#avisForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const form = e.target;
    const fd = new FormData(form);
    const texte = fd.get('texte').trim();
    if(!texte) return;
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Envoi...';
    try{
      await addDoc(collection(fbDB, C_AVIS), { nom: (fd.get('nom')||'').trim(), texte, reponse:'', createdAt: Date.now() });
      form.reset();
      toast('✅ Message envoyé, merci !');
    }catch(err){ toast('❌ Erreur : '+err.message); }
    btn.disabled = false; btn.textContent = 'Envoyer';
  });
}

/* ── Admin: Inscriptions ── */
let inscSelected = new Set();
async function renderAdminInscriptions(){
  const body = document.getElementById('aBody');
  const snap = await getDocs(query(collection(fbDB, C_INSC), orderBy('dateInscription','desc')));
  const list = snap.docs.map(d=>({id:d.id,...d.data()}));
  const chipClass = s => s==='inscrit' ? 'chip-done' : s==='contacté' ? 'chip-contact' : 'chip-new';
  const decChipClass = d => d==='retenu' ? 'chip-done' : d==='non_retenu' ? 'chip-contact' : 'chip-new';
  const decLabel = d => d==='retenu' ? '✅ Retenu' : d==='non_retenu' ? '❌ Non retenu' : '⏳ En attente';
  const joursAttente = ts => Math.floor((Date.now()-ts)/86400000);
  const RAPPEL_SEUIL = 3; // jours avant alerte

  body.innerHTML = `
    <div class="a-card">
      <h3>✉️ Modèles de message (décision d'admission)</h3>
      <p class="t2" style="margin-bottom:10px">Utilisez <code>{prenom}</code> pour insérer le prénom automatiquement.</p>
      <label class="f-label">Message si retenu(e)</label>
      <textarea class="a-in" rows="4" id="tplRetenu">${esc(msgTemplates.retenu)}</textarea>
      <label class="f-label">Message si non retenu(e)</label>
      <textarea class="a-in" rows="4" id="tplNonRetenu">${esc(msgTemplates.non_retenu)}</textarea>
      <div style="margin-top:10px"><button class="btn btn-ink btn-sm" id="tplSave">💾 Enregistrer les modèles</button></div>
    </div>
    <div class="a-card" id="bulkBar" style="${inscSelected.size?'':'display:none'}">
      <h3>📤 Envoi groupé (${inscSelected.size} sélectionné${inscSelected.size>1?'s':''})</h3>
      <p class="t2" style="margin-bottom:10px">Ouvre les liens de notification un par un pour chaque élève sélectionné, selon sa décision actuelle.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" id="bulkWa">📲 Ouvrir tout en WhatsApp</button>
        <button class="btn btn-outline btn-sm" id="bulkEmail">✉️ Ouvrir tout en Email</button>
        <button class="btn btn-outline btn-sm" id="bulkSms">💬 Ouvrir tout en SMS</button>
        <button class="btn btn-outline btn-sm" id="bulkClear">Vider la sélection</button>
      </div>
    </div>
    <div class="a-card">
      <h3>📄 Liste des élèves retenus (${list.filter(r=>r.decision==='retenu').length})</h3>
      <p class="t2" style="margin-bottom:10px">Génère un PDF avec nom, prénom, classe, filière et téléphone de tous les élèves marqués « Retenu ».</p>
      <button class="btn btn-red btn-sm" id="pdfRetenus">⬇️ Télécharger le PDF</button>
    </div>
    <div class="a-card"><h3>Fiches reçues (${list.length})</h3>
      ${list.length ? list.map(r=>{
        const jrs = joursAttente(r.dateInscription);
        const enAttenteDecision = !r.decision || r.decision==='en_attente';
        const alerte = enAttenteDecision && jrs>=RAPPEL_SEUIL;
        return `
        <div class="a-row" style="${alerte?'border-left:3px solid var(--red);padding-left:8px':''}">
          <input type="checkbox" data-select="${r.id}" ${inscSelected.has(r.id)?'checked':''} style="margin-top:4px">
          <div class="main">
            <div class="t1">${esc(r.nom)} ${esc(r.prenom)} <span class="chip ${chipClass(r.statut)}">${esc(r.statut||'nouveau')}</span> <span class="chip ${decChipClass(r.decision)}">${decLabel(r.decision)}</span></div>
            <div class="t2">${esc(r.classe)}${r.filiere?' · '+esc(r.filiere):''} · ${esc(r.telephone)}${r.email?' · '+esc(r.email):''} · ${new Date(r.dateInscription).toLocaleDateString('fr-FR')}</div>
            ${r.message ? `<div class="t2">💬 ${esc(r.message)}</div>` : ''}
            ${alerte ? `<div class="t2" style="color:var(--red)">⏰ En attente de décision depuis ${jrs} jour${jrs>1?'s':''}</div>` : ''}
          </div>
          <a class="btn btn-outline btn-sm" href="${waLink(r.telephone)}" target="_blank" rel="noopener">WhatsApp</a>
          <a class="btn ${r.bienvenueEnvoyee?'btn-outline':'btn-red'} btn-sm" href="${waWelcomeLink(r.telephone, r.prenom)}" target="_blank" rel="noopener" data-bienvenue="${r.id}">${r.bienvenueEnvoyee?'✅ Bienvenue envoyée':'🎉 Envoyer bienvenue'}</a>
          <select class="a-in" style="width:auto;margin-top:0" data-status="${r.id}">
            <option value="nouveau" ${r.statut==='nouveau'?'selected':''}>Nouveau</option>
            <option value="contacté" ${r.statut==='contacté'?'selected':''}>Contacté</option>
            <option value="inscrit" ${r.statut==='inscrit'?'selected':''}>Inscrit</option>
          </select>
          <button class="btn btn-outline btn-sm" data-del="${r.id}">Supprimer</button>
        </div>
        <div class="a-row" style="flex-wrap:wrap;align-items:center;gap:8px">
          <select class="a-in" style="width:auto;margin-top:0" data-decision="${r.id}">
            <option value="en_attente" ${enAttenteDecision?'selected':''}>⏳ Décision : en attente</option>
            <option value="retenu" ${r.decision==='retenu'?'selected':''}>✅ Retenu(e) pour le club</option>
            <option value="non_retenu" ${r.decision==='non_retenu'?'selected':''}>❌ Non retenu(e)</option>
          </select>
          <a class="btn btn-outline btn-sm" href="${decisionWaLink(r.telephone, r.prenom, r.decision==='non_retenu'?'non_retenu':'retenu')}" target="_blank" rel="noopener" data-decision-send="${r.id}" data-channel="wa">📲 Notifier WhatsApp</a>
          ${r.email ? `<a class="btn btn-outline btn-sm" href="${decisionMailLink(r.email, r.prenom, r.decision==='non_retenu'?'non_retenu':'retenu')}" data-decision-send="${r.id}" data-channel="email">✉️ Notifier Email</a>` : `<span class="t2" style="opacity:.6">✉️ Pas d'email fourni</span>`}
          <a class="btn btn-outline btn-sm" href="${decisionSmsLink(r.telephone, r.prenom, r.decision==='non_retenu'?'non_retenu':'retenu')}" data-decision-send="${r.id}" data-channel="sms">💬 Notifier SMS</a>
          ${r.decisionNotifiee ? `<span class="t2" style="color:var(--ok,#1a8f4c)">✅ Notification envoyée${r.decisionCanal?' ('+esc(r.decisionCanal)+')':''}</span>` : ''}
        </div>`;
      }).join('') : '<div class="empty-note">Aucune fiche reçue pour le moment.</div>'}
    </div>`;

  document.getElementById('tplSave').onclick = async ()=>{
    const retenu = document.getElementById('tplRetenu').value.trim();
    const non_retenu = document.getElementById('tplNonRetenu').value.trim();
    await setDoc(doc(fbDB, C_CONFIG, 'messages'), {retenu, non_retenu});
    msgTemplates = {retenu, non_retenu};
    toast('✅ Modèles enregistrés');
    renderAdminInscriptions();
  };

  document.getElementById('pdfRetenus').onclick = ()=>{
    const retenus = list.filter(r=>r.decision==='retenu');
    if(!retenus.length){ toast('⚠️ Aucun élève retenu pour le moment'); return; }
    generatePdfRetenus(retenus);
  };

  body.querySelectorAll('[data-select]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) inscSelected.add(cb.dataset.select); else inscSelected.delete(cb.dataset.select);
      renderAdminInscriptions();
    };
  });
  const bulkWa = document.getElementById('bulkWa'), bulkEmail = document.getElementById('bulkEmail'),
        bulkSms = document.getElementById('bulkSms'), bulkClear = document.getElementById('bulkClear');
  const selectedRecords = ()=> list.filter(r=>inscSelected.has(r.id));
  if(bulkWa) bulkWa.onclick = ()=>{
    selectedRecords().forEach(r=> window.open(decisionWaLink(r.telephone, r.prenom, r.decision==='non_retenu'?'non_retenu':'retenu'), '_blank'));
    toast('📲 Liens WhatsApp ouverts — envoyez-les un par un');
  };
  if(bulkEmail) bulkEmail.onclick = ()=>{
    const withEmail = selectedRecords().filter(r=>r.email);
    withEmail.forEach(r=> window.open(decisionMailLink(r.email, r.prenom, r.decision==='non_retenu'?'non_retenu':'retenu'), '_blank'));
    toast(withEmail.length ? "✉️ Liens Email ouverts" : "⚠️ Aucun élève sélectionné n'a fourni d'email");
  };
  if(bulkSms) bulkSms.onclick = ()=>{
    selectedRecords().forEach(r=> window.open(decisionSmsLink(r.telephone, r.prenom, r.decision==='non_retenu'?'non_retenu':'retenu'), '_blank'));
    toast('💬 Liens SMS ouverts');
  };
  if(bulkClear) bulkClear.onclick = ()=>{ inscSelected.clear(); renderAdminInscriptions(); };

  body.querySelectorAll('[data-status]').forEach(sel=>{
    sel.onchange = async ()=>{ await updateDoc(doc(fbDB, C_INSC, sel.dataset.status), {statut: sel.value}); toast('✅ Statut mis à jour'); };
  });
  body.querySelectorAll('[data-decision]').forEach(sel=>{
    sel.onchange = async ()=>{
      await updateDoc(doc(fbDB, C_INSC, sel.dataset.decision), {decision: sel.value});
      toast('✅ Décision enregistrée');
      renderAdminInscriptions();
    };
  });
  body.querySelectorAll('[data-decision-send]').forEach(a=>{
    a.addEventListener('click', async ()=>{
      const id = a.dataset.decisionSend;
      await updateDoc(doc(fbDB, C_INSC, id), {decisionNotifiee: true, decisionCanal: a.dataset.channel});
      toast('✅ Notification marquée comme envoyée');
      setTimeout(renderAdminInscriptions, 400);
    });
  });
  body.querySelectorAll('[data-bienvenue]').forEach(a=>{
    a.addEventListener('click', async ()=>{
      await updateDoc(doc(fbDB, C_INSC, a.dataset.bienvenue), {bienvenueEnvoyee: true});
      toast('✅ Marqué comme envoyé');
      setTimeout(renderAdminInscriptions, 400);
    });
  });
  body.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = async ()=>{ if(!confirm('Supprimer cette fiche ?')) return;
      await deleteDoc(doc(fbDB, C_INSC, b.dataset.del)); toast('🗑️ Supprimée'); renderAdminInscriptions(); };
  });
}
